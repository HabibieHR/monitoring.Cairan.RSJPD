<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health Pro - Monitoring Cairan Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #1e293b; overflow-x: hidden; }
        .clinical-card { background: #ffffff; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; transition: all 0.3s ease; }
        .mira-accent { background: #4f46e5; }
        .mira-text-accent { color: #4f46e5; }
        
        /* Status Pills */
        .status-pill { padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-normal { background-color: #ecfdf5; color: #065f46; }
        .status-warning { background-color: #fffbeb; color: #92400e; animation: pulseRed 2s infinite; }
        .status-critical { background-color: #fef2f2; color: #991b1b; animation: pulseRed 1s infinite; }

        /* Chat Bubbles */
        .chat-bubble-mira { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px 20px 20px 0; color: #334155; }
        .chat-bubble-user { background: #4f46e5; color: white; border-radius: 20px 20px 0 20px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .pulse-soft { animation: pulseSoft 2s infinite; }
        @keyframes pulseSoft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        /* Utilities */
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="max-w-md w-full space-y-5 relative">
        
        <div id="display-profile" class="hidden clinical-card p-6 flex justify-between items-center animate-fade z-30 relative">
            <div class="flex items-center gap-4 text-left">
                <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center border-4 border-white shadow-inner text-slate-400">
                    <i class="fas fa-user-injured text-2xl"></i>
                </div>
                <div>
                    <h2 id="patient-name" class="font-extrabold text-xl leading-none uppercase tracking-tight text-slate-950"></h2>
                    <p id="patient-room" class="text-[11px] mira-text-accent mt-1.5 font-bold uppercase tracking-wider"></p>
                </div>
            </div>
            <button onclick="resetApp()" class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <div id="main-dashboard" class="hidden space-y-5 animate-fade relative z-20">
            <div class="clinical-card p-8 text-center space-y-6 relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Asupan Hari Ini</span>
                    <span id="status-tag" class="status-pill status-normal">Memuat...</span>
                </div>
                
                <div class="relative z-10">
                    <span id="percent-display" class="text-7xl font-black tracking-tighter text-slate-950">0<small class="text-2xl font-bold text-slate-400">%</small></span>
                    <p id="daily-limit-text" class="text-xs text-slate-500 mt-1">dari batas 1.500 ml</p>
                </div>
                
                <div class="w-full bg-slate-100 rounded-full h-4 relative z-10 overflow-hidden shadow-inner">
                    <div id="progress-bar" class="mira-accent h-full rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-3 pt-2 text-center z-10 relative border-t border-slate-100">
                    <div class="p-3 bg-slate-50 rounded-xl">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Masuk</p>
                        <p class="text-lg font-extrabold mira-text-accent"><span id="intake-display">0</span><small class="text-xs ml-0.5">ml</small></p>
                    </div>
                    <div class="p-3 bg-slate-50 rounded-xl">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Keluar</p>
                        <p class="text-lg font-extrabold text-slate-950"><span id="output-display">0</span><small class="text-xs ml-0.5">ml</small></p>
                    </div>
                    <div class="p-3 bg-slate-50 rounded-xl border border-indigo-50">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Balance</p>
                        <p id="balance-display" class="text-lg font-extrabold text-emerald-600">0<small class="text-xs ml-0.5">ml</small></p>
                    </div>
                </div>
            </div>

            <div class="clinical-card p-7 space-y-5">
                <div class="flex gap-4">
                    <div class="flex-1 text-left">
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">Volume Cairan (ml)</label>
                        <input id="fluid-amount" type="number" pattern="[0-9]*" inputmode="numeric" placeholder="Contoh: 250" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl font-extrabold text-2xl outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all" min="1">
                    </div>
                    <div class="w-1/3 text-left">
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block">Jenis</label>
                        <select id="fluid-type" class="w-full h-[66px] bg-slate-50 border border-slate-200 px-4 rounded-2xl font-bold text-sm outline-none appearance-none text-slate-700 focus:border-indigo-400">
                            <option value="IN">💧 Minum</option>
                            <option value="OUT">🚽 Urin</option>
                        </select>
                    </div>
                </div>
                <button onclick="addRecord()" class="w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-lg shadow-indigo-200 active:scale-95 transition-all text-[11px] uppercase tracking-widest flex items-center justify-center gap-3">
                    <i class="fas fa-plus-circle text-sm"></i>
                    Catat Cairan
                </button>
            </div>
        </div>

        <div id="setup-form" class="clinical-card p-12 space-y-10 animate-fade relative z-40">
            <div class="text-center space-y-3">
                <div class="w-20 h-20 mira-accent rounded-[2rem] flex items-center justify-center mx-auto text-white shadow-xl shadow-indigo-100"><i class="fas fa-hospital-symbol text-3xl"></i></div>
                <h2 class="text-3xl font-black tracking-tighter text-slate-950 uppercase italic">Mira<span class="mira-text-accent">Health</span></h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sistem Monitoring RS Indonesia</p>
            </div>
            <div class="space-y-4 text-left">
                <input id="input-name" type="text" placeholder="Nama Lengkap Pasien" class="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl font-semibold outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50">
                <input id="input-room" type="text" placeholder="Nomor Kamar (Contoh: 301A)" class="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl font-semibold outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50">
            </div>
            <button onclick="saveIdentity()" class="w-full mira-accent text-white font-bold py-6 rounded-2xl uppercase text-[11px] tracking-widest shadow-lg shadow-indigo-100 flex items-center justify-center gap-3">
                Mulai Monitoring
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </div>

        <button onclick="toggleChat()" id="chat-fab" class="hidden fixed bottom-6 right-6 w-16 h-16 mira-accent text-white rounded-full shadow-2xl flex items-center justify-center z-50 border-4 border-white pulse-soft transition-transform hover:scale-110">
            <i class="fas fa-robot text-2xl"></i>
        </button>

        <div id="chat-panel" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm p-4 flex items-end md:items-center justify-center transition-opacity duration-300 opacity-0">
            <div id="chat-content" class="bg-white w-full max-w-md h-[80vh] rounded-[32px] shadow-2xl flex flex-col overflow-hidden transform translate-y-20 transition-transform duration-300 ease-out">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
                    <div class="flex items-center gap-4 text-left">
                        <div class="w-12 h-12 mira-accent rounded-xl flex items-center justify-center text-white"><i class="fas fa-robot text-xl"></i></div>
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-950 uppercase">Asisten Mira.AI</h3>
                            <div class="flex items-center gap-1.5 mt-0.5"><span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span><p class="text-[9px] text-emerald-600 font-bold uppercase">Gemini Engine Aktif</p></div>
                        </div>
                    </div>
                    <button onclick="toggleChat()" class="text-slate-300 hover:text-red-500 transition-colors p-2"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-5 chat-container bg-slate-50/50">
                    <div class="flex justify-start gap-3 text-left">
                        <div class="w-8 h-8 rounded-lg mira-accent flex-shrink-0 flex items-center justify-center text-white text-[10px] font-bold">M</div>
                        <div class="chat-bubble-mira p-4 text-[11px] font-semibold leading-relaxed">Halo! Saya Mira.AI. Saya memantau data cairan Anda. Ada yang ingin ditanyakan mengenai kondisi hari ini?</div>
                    </div>
                </div>
                
                <div class="p-5 bg-white border-t border-slate-100 flex gap-3">
                    <input id="chat-input" type="text" placeholder="Tanya Mira apa saja..." class="flex-1 bg-slate-50 p-5 rounded-2xl outline-none text-xs font-semibold focus:ring-2 focus:ring-indigo-100 border border-slate-100 transition-all">
                    <button onclick="askMira()" class="w-14 h-14 mira-accent text-white rounded-2xl flex items-center justify-center active:scale-95 transition-all disabled:opacity-50" id="chat-send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GANTI URL INI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
        const GAS_PROXY_URL = "https://script.google.com/macros/s/AKfycbzb7nu7YIR28Ee6Q1PGPHSJBSZj-LJHsH1BphghdJ-esebem-QNVB_h-VVQ6tFOG5Ss/exec"; 
        const LIMIT_HARIAN = 1500;

        // --- Core Functions ---

        // Validasi dan Perbaikan Reset Harian (Menggunakan Tanggal Lokal)
        function getLocalConfig() {
            const today = new Date().toLocaleDateString('en-CA'); // Format YYYY-MM-DD lokal
            const savedDate = localStorage.getItem('mira_date');

            // Jika tanggal berbeda, reset data harian
            if (savedDate !== today) {
                localStorage.setItem('mira_date', today);
                localStorage.setItem('mira_total_in', 0);
                localStorage.setItem('mira_total_out', 0);
                return { totalIn: 0, totalOut: 0, date: today };
            }

            return {
                totalIn: parseInt(localStorage.getItem('mira_total_in') || 0),
                totalOut: parseInt(localStorage.getItem('mira_total_out') || 0),
                date: today
            };
        }

        function checkUser() {
            const name = localStorage.getItem('mira_name');
            if(name) {
                // Sembunyikan form daftar, tunjukkan dashboard
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('display-profile').classList.remove('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('chat-fab').classList.remove('hidden');
                
                // Isi data profil
                document.getElementById('patient-name').innerText = name;
                document.getElementById('patient-room').innerText = `KAMAR ${localStorage.getItem('mira_room')}`;
                
                // Inisialisasi UI
                updateUI();
            }
        }

        function saveIdentity() {
            const nameInput = document.getElementById('input-name');
            const roomInput = document.getElementById('input-room');
            const name = nameInput.value.trim();
            const room = roomInput.value.trim();

            if(!name || !room) {
                if(!name) nameInput.classList.add('border-red-400', 'bg-red-50');
                if(!room) roomInput.classList.add('border-red-400', 'bg-red-50');
                return; // Berhenti jika kosong
            }
            
            // Simpan identitas
            localStorage.setItem('mira_name', name.toUpperCase());
            localStorage.setItem('mira_room', room.toUpperCase());
            
            // Paksa inisialisasi tanggal lokal baru
            localStorage.removeItem('mira_date'); 
            getLocalConfig(); 

            location.reload(); // Reload untuk masuk ke mode dashboard
        }

        // --- UI & Logic Functions ---

        // Helper Format Ribuan (Gaya Indonesia: 1.500)
        const formatNumber = (num) => new Intl.NumberFormat('id-ID').format(num);

        function updateUI() {
            const config = getLocalConfig(); // Ambil data terbaru (sekaligus cek reset harian)
            const totalIn = config.totalIn;
            const totalOut = config.totalOut;
            const balance = totalIn - totalOut;
            const percentIn = Math.min((totalIn / LIMIT_HARIAN) * 100, 100);

            // Update Angka di UI (dengan format ribuan)
            document.getElementById('intake-display').innerText = formatNumber(totalIn);
            document.getElementById('output-display').innerText = formatNumber(totalOut);
            
            // Update Balance
            const balanceEl = document.getElementById('balance-display');
            balanceEl.innerText = `${formatNumber(balance)}ml`;
            if (balance > 0) balanceEl.className = "text-lg font-extrabold text-emerald-600";
            else if (balance < 0) balanceEl.className = "text-lg font-extrabold text-amber-600";
            else balanceEl.className = "text-lg font-extrabold text-slate-600";

            // Update Persentase & Progress Bar
            document.getElementById('percent-display').innerHTML = `${Math.round(percentIn)}<small class="text-2xl font-bold text-slate-400">%</small>`;
            
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percentIn + '%';

            // Update Status Tag & Warna Progress Bar
            const tag = document.getElementById('status-tag');
            if(percentIn >= 100) {
                tag.innerText = "🚨 Batas Terlampaui"; 
                tag.className = "status-pill status-critical";
                progressBar.className = "bg-red-600 h-full rounded-full transition-all duration-1000 shadow";
            } else if (percentIn >= 80) {
                tag.innerText = "⚠️ Hampir Batas"; 
                tag.className = "status-pill status-warning";
                progressBar.className = "bg-amber-500 h-full rounded-full transition-all duration-1000 shadow";
            } else {
                tag.innerText = "✅ Normal"; 
                tag.className = "status-pill status-normal";
                progressBar.className = "mira-accent h-full rounded-full transition-all duration-1000 shadow";
            }
        }

        function addRecord() {
            const valInput = document.getElementById('fluid-amount');
            const typeSelect = document.getElementById('fluid-type');
            const val = parseInt(valInput.value);
            const type = typeSelect.value;
            
            // Validasi Input Visual (Ganti alert)
            if(!val || val <= 0) {
                valInput.classList.add('border-red-400', 'bg-red-50', 'animate-pulse');
                setTimeout(() => valInput.classList.remove('animate-pulse'), 500);
                return;
            }
            
            // Hapus style error jika divalidasi
            valInput.classList.remove('border-red-400', 'bg-red-50');

            const config = getLocalConfig(); // Pastikan data hari ini valid
            
            if(type === 'IN') {
                localStorage.setItem('mira_total_in', config.totalIn + val);
            } else {
                localStorage.setItem('mira_total_out', config.totalOut + val);
            }

            // Update UI & Bersihkan Input
            updateUI();
            valInput.value = '';
            
            // Sukses Feedback Visual (Opsional: Tombol berubah hijau sebentar)
            const btn = document.querySelector('button[onclick="addRecord()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-check-circle text-sm"></i> Tersimpan!`;
            btn.classList.remove('mira-accent');
            btn.classList.add('bg-emerald-600');
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('mira-accent');
            }, 1500);
        }

        // --- Chat AI Functions ---

        function toggleChat() {
            const panel = document.getElementById('chat-panel');
            const content = document.getElementById('chat-content');
            
            if(panel.classList.contains('hidden')) {
                // Buka
                panel.classList.remove('hidden');
                setTimeout(() => {
                    panel.classList.remove('opacity-0');
                    content.classList.remove('translate-y-20');
                }, 10);
            } else {
                // Tutup
                panel.classList.add('opacity-0');
                content.classList.add('translate-y-20');
                setTimeout(() => panel.classList.add('hidden'), 300);
            }
        }

        async function askMira() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            const sendBtn = document.getElementById('chat-send-btn');
            const prompt = input.value.trim();
            
            if(!prompt) return;

            // 1. Tampilkan Chat User
            box.innerHTML += `
                <div class="flex justify-end animate-fade text-right">
                    <div class="chat-bubble-user p-4 text-xs font-semibold max-w-[85%]">${prompt}</div>
                </div>`;
            
            input.value = ""; 
            input.disabled = true;
            sendBtn.disabled = true;
            box.scrollTop = box.scrollHeight;

            // 2. Tampilkan Loading State Mira
            const typingId = "typing-" + Date.now();
            box.innerHTML += `
                <div id="${typingId}" class="flex justify-start gap-3 text-left animate-fade">
                    <div class="w-8 h-8 rounded-lg mira-accent flex items-center justify-center text-white text-[10px] font-bold">M</div>
                    <div class="chat-bubble-mira p-4 text-[11px] font-semibold italic text-slate-400">Mira sedang berpikir...</div>
                </div>`;
            box.scrollTop = box.scrollHeight;

            // 3. Persiapkan Konteks Medis Sederhana
            const config = getLocalConfig();
            const balance = config.totalIn - config.totalOut;
            const context = `Pasien: ${localStorage.getItem('mira_name')}. Data Hari Ini lokal: Masuk ${config.totalIn}ml, Keluar ${config.totalOut}ml, Balance ${balance}ml. Batas: ${LIMIT_HARIAN}ml.`;

            try {
                // 4. Panggil API GAS (Dengan penanganan Redirect/CORS)
                const response = await fetch(GAS_PROXY_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Coba mode no-cors jika domain GAS bermasalah, namun response tidak bisa dibaca. 
                                     // Cara terbaik adalah memastikan GAS di-deploy sebagai 'Anyone' dan return ContentService correct.
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, context })
                });

                let reply = "";

                // Penanganan GAS: Kadang kembali sebagai redirect (opaque response di no-cors)
                if (response.type === 'opaque') {
                    reply = "Maaf, saya menerima respon eksternal yang tidak dapat dibaca. Pastikan deployment Google Apps Script Anda diset ke 'Anyone' dan mengembalikan JSON dengan benar.";
                } else {
                    const data = await response.json();
                    reply = data.reply;
                }

                // 5. Tampilkan Respon Mira
                document.getElementById(typingId).remove();
                box.innerHTML += `
                    <div class="flex justify-start gap-3 animate-fade text-left">
                        <div class="w-8 h-8 rounded-lg mira-accent flex-shrink-0 flex items-center justify-center text-white text-[10px] font-bold">M</div>
                        <div class="chat-bubble-mira p-4 text-[11px] font-semibold leading-relaxed text-slate-800">${reply}</div>
                    </div>`;
            } catch (e) {
                // Penanganan Error Koneksi
                document.getElementById(typingId).remove();
                box.innerHTML += `
                    <div class="p-3 rounded-xl bg-red-50 border border-red-100 text-[10px] text-red-600 text-center font-bold">
                        <i class="fas fa-exclamation-triangle mr-1"></i> Gagal terhubung ke AI. Cek URL Script atau Koneksi Internet.
                    </div>`;
                console.error("AI Error:", e);
            } finally {
                // Buka kembali input
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                box.scrollTop = box.scrollHeight;
            }
        }

        // --- Auth Functions ---
        function resetApp() { 
            if(confirm("Apakah Anda yakin ingin keluar dan MENGHAPUS seluruh data identitas di perangkat ini? Data harian akan hilang.")) { 
                localStorage.clear(); 
                location.reload(); 
            } 
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            // Cek user & Inisialisasi reset harian lokal
            checkUser();
            
            // Listener untuk Input Nama & Kamar (Hapus error style saat diketik)
            document.querySelectorAll('#setup-form input').forEach(inp => {
                inp.addEventListener('input', () => inp.classList.remove('border-red-400', 'bg-red-50'));
            });

            // Listener untuk Enter di Chat
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter' && !document.getElementById('chat-input').disabled) askMira();
            });
        });
    </script>
</body>
</html>
