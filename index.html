<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - Gemini AI Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); }
        .ai-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full glass rounded-[3rem] shadow-2xl overflow-hidden border border-white">
        
        <div class="bg-slate-900 p-8 text-white relative">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-[10px] bg-blue-600 px-2 py-1 rounded-full font-bold uppercase tracking-widest">Live Monitoring</span>
                    <h2 id="display-nama" class="text-2xl font-black mt-1 uppercase tracking-tighter">Humaira</h2>
                    <p id="display-info" class="text-[10px] opacity-60 italic italic font-bold">Kamar 001 | Laki-laki</p>
                </div>
                <div class="ai-pulse w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center border-2 border-white/20">
                    <i class="fas fa-brain text-white"></i>
                </div>
            </div>
        </div>

        <div class="p-8 -mt-6 bg-white rounded-t-[3rem] space-y-6">
            
            <div class="space-y-3">
                <div class="flex justify-between items-end px-1">
                    <h3 class="font-bold text-slate-800 text-sm italic italic">Status Cairan Harian</h3>
                    <span id="status-percent" class="text-3xl font-black text-blue-600 tracking-tighter">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-blue-700 h-full transition-all duration-1000 shadow-[0_0_15px_rgba(59,130,246,0.5)]" style="width: 0%"></div>
                </div>
            </div>

            <div id="ai-container" class="hidden p-5 rounded-[2rem] bg-blue-50 border border-blue-100 relative overflow-hidden">
                <div class="flex gap-3 items-start relative z-10">
                    <img src="https://cdn-icons-png.flaticon.com/512/3588/3588621.png" class="w-10 h-10" alt="Nurse AI">
                    <div class="space-y-1">
                        <h4 class="text-[10px] font-bold text-blue-800 uppercase tracking-widest">Suster Gemini AI :</h4>
                        <p id="ai-text" class="text-xs text-blue-900 leading-relaxed font-semibold italic">Menganalisa asupan Anda...</p>
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 p-6 rounded-[2.5rem] space-y-4 border border-slate-100 shadow-sm">
                <div class="flex gap-2">
                    <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 bg-white p-4 rounded-2xl shadow-sm outline-none focus:ring-2 focus:ring-blue-400 text-xl font-bold">
                    <select id="fluid-type" class="bg-white p-4 rounded-2xl font-bold shadow-sm outline-none appearance-none cursor-pointer">
                        <option value="IN">Minum</option>
                        <option value="OUT">Urin</option>
                    </select>
                </div>
                <button id="btn-simpan" onclick="addRecord()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3">
                    <i class="fas fa-paper-plane"></i> SIMPAN & ANALISA AI
                </button>
            </div>
        </div>

        <button onclick="toggleChat()" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all z-50">
            <i class="fas fa-comments text-xl"></i>
        </button>

        <div id="chat-panel" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end sm:items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl h-[80vh] flex flex-col overflow-hidden">
                <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-robot text-2xl"></i>
                        <h3 class="font-bold">Konsultasi AI Suster</h3>
                    </div>
                    <button onclick="toggleChat()"><i class="fas fa-times"></i></button>
                </div>
                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 text-sm scroll-smooth">
                    <div class="bg-blue-50 p-3 rounded-2xl mr-8 text-blue-800">Halo! Saya Suster Gemini AI. Anda bisa bertanya tentang pantangan makanan atau kondisi asupan cairan Anda hari ini.</div>
                </div>
                <div class="p-4 border-t flex gap-2">
                    <input id="chat-input" type="text" placeholder="Tanya sesuatu..." class="flex-1 p-3 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-400">
                    <button onclick="askGemini()" class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
    </script>
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // CONFIGURATION
        const API_KEY = "AIzaSyAdaET3x4YVj5HMJmOIEqx4SgIxDgwrdNA";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG9e0tsti2INZDDcM-HPMO29nojxFxebmRUDz_rR_ZilbNBggWoDTKyc5yxJwMnPtV/exec";
        const LIMIT = 1500;

        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        // Global functions for HTML access
        window.addRecord = async function() {
            const amountInput = document.getElementById('fluid-amount');
            const amount = parseInt(amountInput.value);
            const type = document.getElementById('fluid-type').value;
            const btn = document.getElementById('btn-simpan');

            if(!amount) return alert("Isi ml!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sinkronisasi Drive...`;

            try {
                // DRIVE SYNC (Keep your original logic)
                const payload = { nama: "Humaira", kamar: "001", jk: "Laki-laki", amount, type };
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });

                if(type === 'IN') {
                    let cur = parseInt(localStorage.getItem('totalIn') || 0);
                    localStorage.setItem('totalIn', cur + amount);
                }
                
                updateUI();
                analyzeWithGemini(amount, type);
                amountInput.value = '';
            } catch (e) { alert("Error GDrive."); }
            finally { btn.disabled = false; btn.innerHTML = `<i class="fas fa-paper-plane"></i> SIMPAN & ANALISA AI`; }
        }

        async function analyzeWithGemini(amount, type) {
            const totalIn = localStorage.getItem('totalIn') || 0;
            const aiText = document.getElementById('ai-text');
            document.getElementById('ai-container').classList.remove('hidden');
            aiText.innerText = "Suster AI sedang berpikir...";

            const prompt = `Anda adalah asisten perawat medis spesialis gagal ginjal/jantung. 
            Pasien baru saja mencatat asupan ${type} sebanyak ${amount}ml. 
            Total cairan masuk hari ini adalah ${totalIn}ml dari batas ${LIMIT}ml. 
            Berikan saran medis yang SANGAT SINGKAT (maksimal 20 kata), informatif, dan empati dalam Bahasa Indonesia.`;

            try {
                const result = await model.generateContent(prompt);
                aiText.innerText = result.response.text();
            } catch (e) { aiText.innerText = "AI sedang istirahat. Tetap patuhi batas cairan Anda!"; }
        }

        window.askGemini = async function() {
            const input = document.getElementById('chat-input');
            const msgContainer = document.getElementById('chat-messages');
            if(!input.value) return;

            const userMsg = input.value;
            msgContainer.innerHTML += `<div class="bg-slate-100 p-3 rounded-2xl ml-8 text-right font-bold text-slate-800">${userMsg}</div>`;
            input.value = "";

            const prompt = `Gunakan identitas Suster Gemini AI. Jawab pertanyaan pasien gagal ginjal/jantung berikut dengan ramah dan akurat: ${userMsg}. Hubungkan jawaban dengan pentingnya menjaga asupan cairan harian maksimal 1500ml.`;

            try {
                const result = await model.generateContent(prompt);
                msgContainer.innerHTML += `<div class="bg-blue-50 p-3 rounded-2xl mr-8 text-blue-800"><b>Suster AI:</b> ${result.response.text()}</div>`;
                msgContainer.scrollTop = msgContainer.scrollHeight;
            } catch (e) { alert("Gemini API Error. Cek API Key Anda."); }
        }

        window.toggleChat = () => document.getElementById('chat-panel').classList.toggle('hidden');

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const percent = Math.min((totalIn / LIMIT) * 100, 100);
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";
        }

        updateUI();
    </script>
</body>
</html>
