<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen p-4 pb-10">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        
        <div id="setup-form" class="p-8 space-y-5">
            <div class="text-center">
                <i class="fas fa-user-medical text-5xl text-blue-500 mb-3"></i>
                <h2 class="text-2xl font-bold text-gray-800">Registrasi Pasien</h2>
                <p class="text-sm text-gray-500">Masukkan identitas untuk memulai pemantauan</p>
            </div>
            <div class="space-y-3">
                <input id="input-nama" type="text" placeholder="Nama Lengkap Pasien" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-400 outline-none transition">
                <input id="input-kamar" type="text" placeholder="Nomor Kamar (Contoh: VVIP 302)" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-blue-400 outline-none transition">
                <select id="input-jk" class="w-full border-2 border-gray-100 p-3 rounded-xl bg-white">
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>
            <button onclick="saveIdentity()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                MULAI MONITORING
            </button>
        </div>

        <div id="main-dashboard" class="hidden">
            <div class="bg-slate-800 p-5 text-white flex justify-between items-center">
                <div>
                    <p class="text-[10px] uppercase tracking-widest opacity-60">Pasien Terdaftar</p>
                    <h2 id="display-nama" class="text-lg font-bold text-blue-300"></h2>
                    <p id="display-info" class="text-xs opacity-80"></p>
                </div>
                <button onclick="resetApp()" class="text-xs bg-slate-700 px-3 py-1 rounded border border-slate-600 hover:bg-red-900 transition">Ganti Pasien</button>
            </div>

            <div class="p-6">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-bold text-gray-600">Progress Input Harian</span>
                    <span id="status-percent" class="text-2xl font-black text-blue-600">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-5 mb-6 shadow-inner">
                    <div id="progress-bar" class="bg-green-500 h-5 rounded-full transition-all duration-700 shadow-md" style="width: 0%"></div>
                </div>

                <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 space-y-4">
                    <h3 class="font-bold text-gray-700 flex items-center"><i class="fas fa-tint mr-2 text-blue-500"></i> Tambah Data Cairan</h3>
                    <div class="flex gap-2">
                        <input id="fluid-amount" type="number" placeholder="Jumlah ml" class="flex-1 border-2 border-white p-3 rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-300 text-xl font-bold">
                        <select id="fluid-type" class="border-2 border-white p-3 rounded-xl bg-white font-semibold shadow-sm">
                            <option value="IN">Minum</option>
                            <option value="OUT">Urin</option>
                        </select>
                    </div>
                    <button id="btn-simpan" onclick="addRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-blue-200 shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95">
                        <i class="fas fa-cloud-upload-alt"></i> SIMPAN & KIRIM KE DRIVE
                    </button>
                </div>
            </div>

            <div class="px-6 pb-6">
                <p class="text-[10px] text-center text-gray-400 uppercase tracking-tighter italic">Data sinkron otomatis ke Google Drive Dokter</p>
            </div>
        </div>
    </div>

    <script>
        // LINK GOOGLE APPS SCRIPT ANDA
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3rorMz_9deDLUeiW8dTQ_1fAMUmxYSI6JS-py85j9gbPCs3pxJkE9ZNT_EMzuxuXR/exec";

        function saveIdentity() {
            const nama = document.getElementById('input-nama').value;
            const kamar = document.getElementById('input-kamar').value;
            const jk = document.getElementById('input-jk').value;

            if(!nama || !kamar) return alert("Harap isi Nama dan Nomor Kamar!");

            localStorage.setItem('pasien_nama', nama);
            localStorage.setItem('pasien_kamar', kamar);
            localStorage.setItem('pasien_jk', jk);
            checkUser();
        }

        function checkUser() {
            const nama = localStorage.getItem('pasien_nama');
            if(nama) {
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('display-nama').innerText = nama;
                document.getElementById('display-info').innerText = `Kamar: ${localStorage.getItem('pasien_kamar')} | ${localStorage.getItem('pasien_jk')}`;
                updateUI();
            }
        }

        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const amount = amountInput.value;
            const type = document.getElementById('fluid-type').value;
            const btn = document.getElementById('btn-simpan');

            if(!amount || amount <= 0) return alert("Masukkan jumlah ml!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sedang Mengirim...`;

            const payload = {
                nama: localStorage.getItem('pasien_nama'),
                kamar: localStorage.getItem('pasien_kamar'),
                jk: localStorage.getItem('pasien_jk'),
                amount: amount,
                type: type
            };

            try {
                // KIRIM DATA KE GOOGLE DRIVE
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // UPDATE DATA LOKAL UNTUK PROGRESS BAR
                if(type === 'IN') {
                    let currentIn = parseInt(localStorage.getItem('totalIn') || 0);
                    localStorage.setItem('totalIn', currentIn + parseInt(amount));
                }
                
                alert("Berhasil! Data telah tersimpan di Google Sheet.");
                updateUI();
                amountInput.value = '';
            } catch (e) {
                alert("Gagal terhubung ke Drive. Periksa URL Apps Script Anda.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-cloud-upload-alt"></i> SIMPAN & KIRIM KE DRIVE`;
            }
        }

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const limit = 1500; // Batas harian
            const percent = Math.min((totalIn / limit) * 100, 100);
            
            const pb = document.getElementById('progress-bar');
            pb.style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";

            if(percent >= 100) pb.className = "bg-red-600 h-5 rounded-full transition-all duration-700";
            else if(percent >= 80) pb.className = "bg-yellow-500 h-5 rounded-full transition-all duration-700";
            else pb.className = "bg-green-500 h-5 rounded-full transition-all duration-700";
        }

        function resetApp() {
            if(confirm("Hapus data identitas dan ganti pasien?")) {
                localStorage.clear();
                location.reload();
            }
        }

        checkUser();
    </script>
</body>
</html>
