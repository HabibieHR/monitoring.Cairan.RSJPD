<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health - Monitoring Cairan Pasien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; overflow-x: hidden; }
        .clinical-card { background: #ffffff; border-radius: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .mira-accent { background: #4f46e5; }
        .status-pill { padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .chat-bubble-mira { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 20px 20px 20px 0; color: #334155; }
        .chat-bubble-user { background: #4f46e5; color: white; border-radius: 20px 20px 0 20px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease-out forwards; }
        .chat-panel-animate { transition: transform 0.4s ease-out, opacity 0.4s ease-out; }
        .pulse-soft { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 20px rgba(79, 70, 229, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 4px 30px rgba(79, 70, 229, 0.4); }
            100% { transform: scale(1); box-shadow: 0 4px 20px rgba(79, 70, 229, 0.2); }
        }
        .pulse-red { animation: pulseRed 1s infinite; }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .chat-container::-webkit-scrollbar { width: 5px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="max-w-md w-full space-y-5 relative">
        
        <div id="display-profile" class="hidden clinical-card p-6 flex justify-between items-center animate-fade z-30 relative">
            <div class="flex items-center gap-4 text-left">
                <div class="w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center border-4 border-white shadow-inner overflow-hidden text-slate-300">
                    <i class="fas fa-user-injured text-2xl"></i>
                </div>
                <div>
                    <h2 id="patient-name" class="font-extrabold text-xl leading-none uppercase tracking-tight text-slate-950"></h2>
                    <p id="patient-room" class="text-[11px] text-indigo-600 mt-1.5 font-bold uppercase tracking-wider"></p>
                </div>
            </div>
            <button onclick="resetApp()" class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-300 hover:text-red-500 transition-all">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <div id="main-dashboard" class="hidden space-y-5 animate-fade relative z-20">
            <div class="clinical-card p-8 text-center space-y-6 relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Status Cairan</span>
                    <span id="status-tag" class="status-pill bg-emerald-50 text-emerald-700 text-[10px]">Normal</span>
                </div>
                <div class="relative z-10"><span id="percent-display" class="text-7xl font-black tracking-tighter text-slate-950">0<small class="text-2xl font-bold text-slate-400">%</small></span></div>
                <div class="w-full bg-slate-100 rounded-full h-3 relative z-10 overflow-hidden">
                    <div id="progress-bar" class="mira-accent h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[11px] font-bold text-slate-500 uppercase z-10 relative">
                    <span>Masuk: <span id="intake-display" class="text-indigo-600">0</span>ml</span>
                    <span>Keluar: <span id="output-display" class="text-slate-950">0</span>ml</span>
                </div>
            </div>

            <div class="clinical-card p-7 space-y-5">
                <div class="flex gap-4">
                    <div class="flex-1 text-left">
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Volume (ml)</label>
                        <input id="fluid-amount" type="number" placeholder="250" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl font-extrabold text-xl outline-none focus:border-indigo-400">
                    </div>
                    <div class="w-1/3 text-left">
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Jenis</label>
                        <select id="fluid-type" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl font-bold text-sm outline-none appearance-none text-slate-700">
                            <option value="IN">Minum</option>
                            <option value="OUT">Urin</option>
                        </select>
                    </div>
                </div>
                <button onclick="addRecord()" class="w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-all text-[11px] uppercase tracking-widest">
                    Simpan Data
                </button>
            </div>
        </div>

        <div id="setup-form" class="clinical-card p-12 space-y-10 animate-fade relative z-40">
            <div class="text-center space-y-3">
                <div class="w-20 h-20 mira-accent rounded-[2rem] flex items-center justify-center mx-auto text-white shadow-xl"><i class="fas fa-hospital-symbol text-3xl"></i></div>
                <h2 class="text-3xl font-black tracking-tighter text-slate-950 uppercase italic">Mira Health</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sistem Monitoring RS Indonesia</p>
            </div>
            <div class="space-y-4 text-left">
                <input id="input-name" type="text" placeholder="Nama Lengkap Pasien" class="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl font-semibold outline-none focus:border-indigo-400">
                <input id="input-room" type="text" placeholder="Nomor Kamar (Contoh: 301A)" class="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl font-semibold outline-none focus:border-indigo-400">
            </div>
            <button onclick="saveIdentity()" class="w-full mira-accent text-white font-bold py-6 rounded-2xl uppercase text-[11px] tracking-widest shadow-lg">
                Daftar & Mulai Monitoring
            </button>
        </div>

        <button onclick="toggleChat()" id="chat-fab" class="hidden fixed bottom-6 right-6 w-16 h-16 mira-accent text-white rounded-full shadow-2xl flex items-center justify-center z-50 border-4 border-white pulse-soft">
            <i class="fas fa-robot text-2xl"></i>
        </button>

        <div id="chat-panel" class="hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm p-4 flex items-end md:items-center justify-center">
            <div id="chat-content" class="bg-white w-full max-w-md h-[80vh] rounded-[32px] shadow-2xl flex flex-col overflow-hidden chat-panel-animate translate-y-full opacity-0">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0 z-10">
                    <div class="flex items-center gap-4 text-left">
                        <div class="w-12 h-12 mira-accent rounded-xl flex items-center justify-center text-white"><i class="fas fa-robot text-lg"></i></div>
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-950 uppercase">Asisten Mira.AI</h3>
                            <div class="flex items-center gap-1.5 mt-0.5"><span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span><p class="text-[9px] text-emerald-600 font-bold uppercase">Gemini Engine Aktif</p></div>
                        </div>
                    </div>
                    <button onclick="toggleChat()" class="text-slate-300 hover:text-slate-500"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-5 chat-container bg-slate-50/40">
                    <div class="flex justify-start gap-3 text-left">
                        <div class="w-8 h-8 rounded-lg mira-accent flex-shrink-0 flex items-center justify-center text-white text-[10px] font-bold">M</div>
                        <div class="chat-bubble-mira p-4 text-[11px] font-bold leading-relaxed">Halo! Saya Mira.AI. Bagaimana kondisi asupan cairan Anda hari ini?</div>
                    </div>
                </div>
                <div class="p-5 bg-white border-t border-slate-100 flex gap-3">
                    <input id="chat-input" type="text" placeholder="Tanya Mira apa saja..." class="flex-1 bg-slate-50 p-5 rounded-2xl outline-none text-xs font-semibold focus:ring-2 focus:ring-indigo-100 border border-slate-100">
                    <button onclick="askMira()" class="w-14 h-14 mira-accent text-white rounded-2xl flex items-center justify-center active:scale-95"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL SCRIPT ANDA SUDAH DIMASUKKAN
        const GAS_PROXY_URL = "https://script.google.com/macros/s/AKfycbzb7nu7YIR28Ee6Q1PGPHSJBSZj-LJHsH1BphghdJ-esebem-QNVB_h-VVQ6tFOG5Ss/exec"; 
        const LIMIT_HARIAN = 1500;

        function saveIdentity() {
            const name = document.getElementById('input-name').value;
            const room = document.getElementById('input-room').value;
            if(!name || !room) return alert("Lengkapi data!");
            localStorage.setItem('mira_name', name.toUpperCase());
            localStorage.setItem('mira_room', room.toUpperCase());
            localStorage.setItem('mira_total_in', 0);
            localStorage.setItem('mira_total_out', 0);
            location.reload();
        }

        function checkUser() {
            const name = localStorage.getItem('mira_name');
            if(name) {
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('display-profile').classList.remove('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('chat-fab').classList.remove('hidden');
                document.getElementById('patient-name').innerText = name;
                document.getElementById('patient-room').innerText = `KAMAR ${localStorage.getItem('mira_room')}`;
                updateUI();
            }
        }

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('mira_total_in') || 0);
            const totalOut = parseInt(localStorage.getItem('mira_total_out') || 0);
            const percentIn = Math.min((totalIn / LIMIT_HARIAN) * 100, 100);
            document.getElementById('intake-display').innerText = totalIn;
            document.getElementById('output-display').innerText = totalOut;
            document.getElementById('percent-display').innerHTML = `${Math.round(percentIn)}<small class="text-2xl font-bold text-slate-400">%</small>`;
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percentIn + '%';
            const tag = document.getElementById('status-tag');
            if(percentIn >= 100) {
                tag.innerText = "BATAS KRITIS"; tag.className = "status-pill bg-red-100 text-red-700 pulse-red";
                progressBar.className = "bg-red-600 h-full rounded-full transition-all duration-1000";
            } else {
                tag.innerText = "NORMAL"; tag.className = "status-pill bg-emerald-50 text-emerald-700";
                progressBar.className = "mira-accent h-full rounded-full transition-all duration-1000";
            }
        }

        function addRecord() {
            const valInput = document.getElementById('fluid-amount');
            const val = parseInt(valInput.value);
            const type = document.getElementById('fluid-type').value;
            if(!val || val <= 0) return alert("Jumlah tidak valid!");
            if(type === 'IN') {
                let cur = parseInt(localStorage.getItem('mira_total_in') || 0);
                localStorage.setItem('mira_total_in', cur + val);
            } else {
                let cur = parseInt(localStorage.getItem('mira_total_out') || 0);
                localStorage.setItem('mira_total_out', cur + val);
            }
            updateUI(); valInput.value = ''; alert("Berhasil disimpan!");
        }

        function toggleChat() {
            const panel = document.getElementById('chat-panel');
            const content = document.getElementById('chat-content');
            if(panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                setTimeout(() => content.classList.remove('translate-y-full', 'opacity-0'), 10);
            } else {
                content.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => panel.classList.add('hidden'), 400);
            }
        }

        async function askMira() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            const prompt = input.value.trim();
            if(!prompt) return;

            box.innerHTML += `<div class="flex justify-end mb-4 animate-fade text-right"><div class="chat-bubble-user p-4 text-xs font-semibold max-w-[80%]">${prompt}</div></div>`;
            input.value = ""; box.scrollTop = box.scrollHeight;

            const typingId = "typing-" + Date.now();
            box.innerHTML += `<div id="${typingId}" class="flex justify-start gap-3 mb-4 text-left"><div class="w-8 h-8 rounded-lg mira-accent flex items-center justify-center text-white text-[10px] font-bold">M</div><div class="chat-bubble-mira p-4 text-[11px] font-bold italic text-slate-400">Mira sedang menganalisis...</div></div>`;
            box.scrollTop = box.scrollHeight;

            const name = localStorage.getItem('mira_name');
            const total = localStorage.getItem('mira_total_in');
            const context = `Pasien: ${name}, Cairan: ${total}ml / 1500ml.`;

            try {
                const response = await fetch(GAS_PROXY_URL, {
                    method: 'POST',
                    body: JSON.stringify({ prompt, context })
                });
                const data = await response.json();
                document.getElementById(typingId).remove();
                box.innerHTML += `<div class="flex justify-start gap-3 mb-4 animate-fade text-left"><div class="w-8 h-8 rounded-lg mira-accent flex items-center justify-center text-white text-[10px] font-bold">M</div><div class="chat-bubble-mira p-4 text-[11px] font-bold leading-relaxed text-slate-700">${data.reply}</div></div>`;
                box.scrollTop = box.scrollHeight;
            } catch (e) {
                document.getElementById(typingId).remove();
                box.innerHTML += `<div class="text-[10px] text-red-500 text-center font-black">Gangguan Koneksi AI.</div>`;
            }
        }

        function resetApp() { if(confirm("Logout?")) { localStorage.clear(); location.reload(); } }
        document.addEventListener('DOMContentLoaded', checkUser);
        document.getElementById('chat-input').addEventListener('keypress', (e) => e.key === 'Enter' && askMira());
    </script>
</body>
</html>
