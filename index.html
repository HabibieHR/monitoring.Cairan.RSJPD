<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mira Health Pro - Clinical Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --mira-slate: #334155; }
        body { font-family: 'Inter', sans-serif; transition: background 0.5s ease; }
        
        /* Light & Dark Mode Logic */
        body.light-mode { background: #f4f7f6; color: #1e293b; }
        body.dark-mode { background: #0f172a; color: #f1f5f9; }
        body.dark-mode .clinical-card { background: #1e293b; border-color: #334155; shadow: none; }
        body.dark-mode input, body.dark-mode select { background: #334155; color: white; border-color: #475569; }

        .clinical-card { border-radius: 24px; transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .status-pill { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; }
        
        /* Medical Accents */
        .bg-intake { background: #0ea5e9; } /* Blue Sky */
        .bg-output { background: #f59e0b; } /* Amber Urin */
        
        .btn-quick { border: 1px solid #e2e8f0; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 600; transition: all 0.2s; }
        .btn-quick:active { transform: scale(0.95); background: #f1f5f9; }
        body.dark-mode .btn-quick { border-color: #475569; }

        @keyframes pulse-red { 0%, 100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); } 50% { border-color: #fca5a5; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
        .border-critical { animation: pulse-red 2s infinite; border-width: 2px !important; }
        
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="light-mode min-h-screen pb-20">

    <div class="max-w-md mx-auto p-4 space-y-5">
        
        <div id="setup-form" class="hidden clinical-card p-8 space-y-6 text-center animate-fade bg-white mt-10">
            <div class="space-y-2">
                <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-notes-medical text-3xl text-slate-600"></i>
                </div>
                <h2 class="text-xl font-extrabold tracking-tight">Registrasi Pasien</h2>
                <p class="text-xs text-slate-400">Sistem Monitoring Cairan Internasional</p>
            </div>

            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1 block">Nama Lengkap</label>
                    <input id="input-name" type="text" class="w-full p-4 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-slate-200" placeholder="Sesuai Gelang Identitas">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1 block">Jenis Kelamin</label>
                        <select id="input-gender" class="w-full p-4 rounded-xl text-sm font-semibold outline-none">
                            <option value="LAKI-LAKI">LAKI-LAKI</option>
                            <option value="PEREMPUAN">PEREMPUAN</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1 block">No. Kamar</label>
                        <input id="input-room" type="text" class="w-full p-4 rounded-xl text-sm font-semibold outline-none" placeholder="Ex: 302A">
                    </div>
                </div>
            </div>
            
            <button onclick="saveIdentity()" class="w-full bg-slate-800 text-white font-bold py-5 rounded-2xl uppercase text-xs tracking-widest hover:bg-slate-700 transition-all shadow-lg">
                Mulai Monitoring
            </button>
        </div>

        <div id="display-profile" class="hidden clinical-card p-4 flex justify-between items-center sticky top-4 z-50 bg-white/80 backdrop-blur-md border-slate-200">
            <div class="flex items-center gap-3">
                <div id="gender-icon" class="w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm">
                    </div>
                <div>
                    <h2 id="patient-name" class="font-bold text-sm tracking-tight leading-none"></h2>
                    <p class="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-wider">
                        <span id="patient-gender"></span> • <span id="patient-room"></span>
                    </p>
                </div>
            </div>
            <button onclick="resetApp()" class="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center border border-red-100">
                <i class="fas fa-power-off text-xs"></i>
            </button>
        </div>

        <div id="main-dashboard" class="hidden space-y-4 animate-fade">
            <div id="status-card" class="clinical-card p-6 space-y-6 bg-white">
                <div class="flex justify-between items-center">
                    <div class="flex flex-col">
                        <span id="hydration-alert" class="text-[9px] font-black uppercase tracking-widest">Sistem Aktif</span>
                        <span class="text-[8px] text-slate-400 font-medium" id="last-update-time">Belum ada data</span>
                    </div>
                    <span id="status-tag" class="status-pill status-normal bg-slate-100 text-slate-600">Sync</span>
                </div>
                
                <div class="text-center relative">
                    <span id="percent-display" class="text-7xl font-black tracking-tighter italic">0<small class="text-xl not-italic opacity-30">%</small></span>
                    <div class="flex items-center justify-center gap-1 mt-2">
                        <i class="fas fa-bullseye text-[10px] text-slate-300"></i>
                        <p id="target-display" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"></p>
                    </div>
                </div>
                
                <div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden border border-slate-100 shadow-inner">
                    <div id="progress-bar" class="h-full w-0 bg-slate-800 transition-all duration-1000"></div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-2">
                    <div class="bg-sky-50 dark:bg-sky-950/30 p-3 rounded-2xl text-center border border-sky-100 dark:border-sky-900">
                        <p class="text-[8px] font-black text-sky-600 uppercase mb-1">In</p>
                        <p class="text-sm font-bold text-sky-900 dark:text-sky-400" id="intake-display">0 ml</p>
                    </div>
                    <div class="bg-amber-50 dark:bg-amber-950/30 p-3 rounded-2xl text-center border border-amber-100 dark:border-amber-900">
                        <p class="text-[8px] font-black text-amber-600 uppercase mb-1">Out</p>
                        <p class="text-sm font-bold text-amber-900 dark:text-amber-400" id="output-display">0 ml</p>
                    </div>
                    <div id="balance-card" class="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl text-center border border-slate-100 dark:border-slate-700">
                        <p class="text-[8px] font-black text-slate-400 uppercase mb-1">Balance</p>
                        <p class="text-sm font-bold" id="balance-display">0 ml</p>
                    </div>
                </div>
            </div>

            <div class="clinical-card p-6 space-y-5 bg-white">
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-2 block tracking-wider">Volume Cairan</label>
                        <div class="relative">
                            <input id="fluid-amount" type="number" inputmode="numeric" placeholder="0" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl font-black text-3xl outline-none focus:border-slate-300 transition-all pr-12">
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 font-bold text-xs uppercase">ml</span>
                        </div>
                    </div>
                    <div class="w-1/3">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-2 block tracking-wider">Aktivitas</label>
                        <select id="fluid-type" class="w-full h-[68px] bg-slate-50 border border-slate-100 px-2 rounded-2xl font-bold text-[11px] outline-none cursor-pointer">
                            <option value="IN">💧 MASUK</option>
                            <option value="OUT">🚽 KELUAR</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-2">
                    <button onclick="quickAdd(200)" class="btn-quick">200ml</button>
                    <button onclick="quickAdd(250)" class="btn-quick">250ml</button>
                    <button onclick="quickAdd(330)" class="btn-quick">330ml</button>
                    <button onclick="quickAdd(500)" class="btn-quick">500ml</button>
                </div>

                <button id="submit-btn" onclick="addRecord()" class="w-full bg-slate-800 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3 uppercase text-xs tracking-widest">
                    Catat Rekam Medis
                </button>
            </div>

            <div class="clinical-card p-6 bg-white">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tren Hidrasi 7 Hari</h3>
                    <i class="fas fa-chart-line text-slate-200"></i>
                </div>
                <div class="h-44 w-full">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "YOUR_GAS_URL_HERE"; // Ganti dengan URL Google Apps Script Anda
        let myChart = null;

        // Auto Dark Mode Berdasarkan Jam (20:00 - 05:00)
        function checkAutoDarkMode() {
            const hour = new Date().getHours();
            if (hour >= 20 || hour < 5) {
                document.body.classList.replace('light-mode', 'dark-mode');
            }
        }

        // Logic Identitas & Target Berdasarkan Gender
        function saveIdentity() {
            const n = document.getElementById('input-name').value.trim();
            const r = document.getElementById('input-room').value.trim();
            const g = document.getElementById('input-gender').value;
            
            if(n && r) {
                localStorage.setItem('mira_name', n.toUpperCase());
                localStorage.setItem('mira_room', r.toUpperCase());
                localStorage.setItem('mira_gender', g);
                localStorage.setItem('mira_target', g === 'LAKI-LAKI' ? 2500 : 2000); // Masukan Medis 1
                location.reload();
            }
        }

        async function syncWithCloud() {
            const name = localStorage.getItem('mira_name');
            const room = localStorage.getItem('mira_room');
            const gender = localStorage.getItem('mira_gender');
            const target = localStorage.getItem('mira_target') || 1500;

            if(!name) {
                document.getElementById('setup-form').classList.remove('hidden');
                return;
            }

            document.getElementById('display-profile').classList.remove('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('patient-name').innerText = name;
            document.getElementById('patient-room').innerText = `ROOM ${room}`;
            document.getElementById('patient-gender').innerText = gender;
            document.getElementById('target-display').innerText = `Target: ${target} ml`;

            // UI Decoration based on Gender
            const gIcon = document.getElementById('gender-icon');
            gIcon.className = gender === 'LAKI-LAKI' ? 'w-10 h-10 rounded-xl flex items-center justify-center text-white bg-sky-600' : 'w-10 h-10 rounded-xl flex items-center justify-center text-white bg-rose-500';
            gIcon.innerHTML = gender === 'LAKI-LAKI' ? '<i class="fas fa-mars"></i>' : '<i class="fas fa-venus"></i>';

            try {
                const response = await fetch(`${GAS_URL}?name=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}`);
                const data = await response.json();
                updateDisplay(data.totalIn || 0, data.totalOut || 0, data.lastUpdate, target);
                if(data.weekly) renderChart(data.weekly, target);
            } catch (e) { console.log("Offline Mode aktif."); }
        }

        // Masukan UX 2: Quick Add
        function quickAdd(amount) {
            document.getElementById('fluid-amount').value = amount;
            document.getElementById('fluid-type').value = 'IN';
        }

        // Masukan Medis 3: Safety Validation
        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const val = parseInt(amountInput.value);
            if(!val || val <= 0) return;
            
            if(val > 1500) { // Safety Net
                alert("Volume input tidak wajar (>1.5L). Mohon periksa kembali.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sinkronisasi...`;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        type: "SAVE_RECORD",
                        name: localStorage.getItem('mira_name'),
                        room: localStorage.getItem('mira_room'),
                        gender: localStorage.getItem('mira_gender'),
                        fluidType: document.getElementById('fluid-type').value === 'IN' ? 'Minum/Infus' : 'Urin',
                        amount: val
                    })
                });
                const result = await response.json();
                updateDisplay(result.totalIn, result.totalOut, new Date().toISOString(), localStorage.getItem('mira_target'));
                amountInput.value = '';
                btn.innerHTML = `<i class="fas fa-check"></i> Berhasil Terkirim`;
            } catch (e) { btn.innerHTML = `Gagal Koneksi`; }
            finally {
                setTimeout(() => { btn.disabled = false; btn.innerHTML = `Catat Rekam Medis`; }, 2000);
            }
        }

        function updateDisplay(tin, tout, lastUpdate, target) {
            const balance = tin - tout;
            const percent = Math.min((tin / target) * 100, 100);
            
            document.getElementById('intake-display').innerText = tin + " ml";
            document.getElementById('output-display').innerText = tout + " ml";
            document.getElementById('balance-display').innerText = (balance > 0 ? "+" : "") + balance + " ml";
            document.getElementById('percent-display').innerHTML = `${Math.round(percent)}<small class="text-xl opacity-30">%</small>`;
            document.getElementById('progress-bar').style.width = percent + '%';
            
            // Masukan Desain 4: Visualizing Balance
            const balCard = document.getElementById('balance-card');
            const balDisp = document.getElementById('balance-display');
            if(balance > 500) { balDisp.className = "text-sm font-bold text-orange-500"; }
            else if(balance < -200) { balDisp.className = "text-sm font-bold text-red-500"; }
            else { balDisp.className = "text-sm font-bold text-slate-800 dark:text-slate-200"; }

            // Masukan Desain 1: Critical Animation
            const statusCard = document.getElementById('status-card');
            if(percent >= 100) { statusCard.classList.add('border-critical'); }
            else { statusCard.classList.remove('border-critical'); }

            if(lastUpdate) {
                const date = new Date(lastUpdate);
                document.getElementById('last-update-time').innerText = "Update: " + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
        }

        function renderChart(history, target) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.labels,
                    datasets: [
                        {
                            label: 'Intake',
                            data: history.values,
                            borderColor: '#334155',
                            backgroundColor: 'rgba(51, 65, 85, 0.05)',
                            fill: true,
                            tension: 0.4,
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#334155'
                        },
                        {
                            // Masukan Desain 4: Target Line
                            label: 'Target',
                            data: Array(history.labels.length).fill(target),
                            borderColor: 'rgba(239, 68, 68, 0.2)',
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false }, 
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: '700' }, color: '#94a3b8' } } 
                    }
                }
            });
        }

        function resetApp() { if(confirm("Hapus sesi klinis pasien ini?")) { localStorage.clear(); location.reload(); } }
        
        checkAutoDarkMode();
        document.addEventListener('DOMContentLoaded', syncWithCloud);
    </script>
</body>
</html>
