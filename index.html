<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - Clinical Luxury Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .premium-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
        .clinical-bg { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
    </style>
</head>
<body class="clinical-bg min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full glass rounded-[3rem] premium-shadow overflow-hidden border border-white">
        
        <div class="bg-slate-900 p-8 text-white relative">
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <span class="text-[10px] bg-indigo-500 px-3 py-1 rounded-full font-bold uppercase tracking-widest">Medical Monitor</span>
                    <h2 id="display-nama" class="text-3xl font-extrabold mt-2 tracking-tighter uppercase italic italic">HUMAIRA</h2>
                    <p id="display-info" class="text-xs opacity-60 font-bold tracking-wider"></p>
                </div>
                <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-3xl border border-white/20">
                    <i class="fas fa-heartbeat text-red-400"></i>
                </div>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl"></div>
        </div>

        <div class="p-8 -mt-6 glass rounded-t-[3rem] space-y-8">
            
            <div class="space-y-4">
                <div class="flex justify-between items-end px-1">
                    <h3 class="font-bold text-slate-800 text-sm italic italic tracking-tight">Status Asupan Harian</h3>
                    <span id="status-percent" class="text-4xl font-black text-indigo-600 tracking-tighter">0%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner border border-slate-50">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-indigo-700 h-full transition-all duration-1000 shadow-[0_0_15px_rgba(79,70,229,0.5)]" style="width: 0%"></div>
                </div>
                <div id="warning-box" class="hidden mt-4 p-4 rounded-2xl text-xs font-semibold leading-relaxed flex items-center gap-3 transition-all duration-500">
                    <i id="warning-icon" class="fas fa-exclamation-triangle"></i>
                    <p id="warning-text"></p>
                </div>
            </div>

            <div class="bg-indigo-50 p-6 rounded-[2.5rem] space-y-5 border border-indigo-100">
                <div class="flex items-center gap-4 mb-2 relative">
                    <img src="https://cdn-icons-png.flaticon.com/512/3588/3588621.png" class="w-14 h-14" alt="Nurse">
                    <div>
                        <h4 class="font-black text-indigo-950 text-base">Catat Cairan Baru</h4>
                        <p class="text-[10px] text-indigo-700 font-bold italic italic">Data sinkron otomatis ke Drive Dokter</p>
                    </div>
                </div>
                
                <div class="flex gap-2">
                    <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 bg-white p-4 rounded-2xl shadow-inner outline-none focus:ring-2 focus:ring-indigo-400 text-xl font-bold border border-slate-100 transition-all">
                    <select id="fluid-type" class="bg-white p-4 rounded-2xl font-bold shadow-inner outline-none border border-slate-100 appearance-none px-6 cursor-pointer">
                        <option value="IN">Minum</option>
                        <option value="OUT">Urin</option>
                    </select>
                </div>
                <button onclick="addRecord()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl shadow-slate-200 transition-all active:scale-95 flex items-center justify-center gap-3 tracking-widest text-[10px]">
                    <i class="fas fa-paper-plane"></i> SIMPAN & SINKRON DRIVER
                </button>
            </div>
        </div>

        <div class="px-10 pb-10 text-center text-slate-400 font-black text-[10px] uppercase tracking-[0.2em] italic italic">
            Integrated Medical Cloud Synchronized
        </div>
    </div>

    <script>
        const SCRIPT_URL = "GANTI_DENGAN_URL_APPS_SCRIPT_ANDA_DI_SINI";
        const LIMIT = 1500;

        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const amount = amountInput.value;
            const type = document.getElementById('fluid-type').value;

            if(!amount) return;

            try {
                // Keep original data (for UI update)
                const originalAmount = amount;
                
                if(type === 'IN') {
                    let curIn = parseInt(localStorage.getItem('totalIn') || 0);
                    localStorage.setItem('totalIn', curIn + parseInt(originalAmount));
                } else {
                    let curOut = parseInt(localStorage.getItem('totalOut') || 0);
                    localStorage.setItem('totalOut', curOut + parseInt(originalAmount));
                }
                
                // Drive Sync (Async)
                const payload = { 
                    nama: localStorage.getItem('pasien_nama') || "Humaira", 
                    kamar: localStorage.getItem('pasien_kamar') || "001", 
                    jk: localStorage.getItem('pasien_jk') || "Laki-laki", 
                    amount: originalAmount, 
                    type 
                };
                fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });

                updateUI();
                amountInput.value = '';
                alert("Data Berhasil Disimpan Lokal & Sedang Dikirim ke Drive.");
            } catch (e) { alert("Sinkronisasi Gagal."); }
        }

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const totalOut = parseInt(localStorage.getItem('totalOut') || 0);

            // Update identitas
            document.getElementById('display-nama').innerText = localStorage.getItem('pasien_nama') || "HUMAIRA";
            document.getElementById('display-info').innerText = `KAMAR ${localStorage.getItem('pasien_kamar') || "001"} | ${localStorage.getItem('pasien_jk') || "LAKI-LAKI"}`;

            const percent = Math.min((totalIn / LIMIT) * 100, 100);
            const pb = document.getElementById('progress-bar');
            pb.style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";

            const wb = document.getElementById('warning-box');
            const wt = document.getElementById('warning-text');
            const wi = document.getElementById('warning-icon');
            wb.classList.remove('hidden');

            if(percent >= 100) {
                pb.className = "bg-gradient-to-r from-red-500 to-red-600 h-full shadow-[0_0_15px_rgba(220,38,38,0.5)]";
                wb.className = "mt-4 p-4 rounded-2xl text-xs font-semibold leading-relaxed flex items-center gap-3 transition-all duration-500 bg-red-50 text-red-700 border border-red-100";
                wi.className = "fas fa-skull-crossbones text-red-500 mt-1";
                wt.innerHTML = "<strong>BATAS CAIRAN TERCAPAI!</strong> Hentikan asupan cairan. Jika merasa sesak napas, segera hubungi dokter.";
            } else if(percent >= 80) {
                pb.className = "bg-gradient-to-r from-yellow-400 to-yellow-500 h-full shadow-[0_0_15px_rgba(234,179,8,0.5)]";
                wb.className = "mt-4 p-4 rounded-2xl text-xs font-semibold leading-relaxed flex items-center gap-3 transition-all duration-500 bg-yellow-50 text-yellow-700 border border-yellow-100";
                wi.className = "fas fa-exclamation-triangle text-yellow-500 mt-1";
                wt.innerHTML = "<strong>WASPADA!</strong> Anda hampir mencapai batas cairan harian. Kurangi minum.";
            } else {
                pb.className = "bg-gradient-to-r from-indigo-500 to-indigo-700 h-full shadow-[0_0_15px_rgba(79,70,229,0.5)]";
                wb.className = "mt-4 p-4 rounded-2xl text-xs font-semibold leading-relaxed flex items-center gap-3 transition-all duration-500 bg-emerald-50 text-emerald-700 border border-emerald-100";
                wi.className = "fas fa-check-circle text-emerald-500 mt-1";
                wt.innerHTML = "Kondisi asupan cairan Anda saat ini masih dalam batas aman medis.";
            }
        }

        updateUI();
    </script>
</body>
</html>
