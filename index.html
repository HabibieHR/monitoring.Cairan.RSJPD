<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - Clinical Luxury & Suster Mira.AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); }
        .mira-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .mira-pulse { animation: pulse-mira 2s infinite; }
        @keyframes pulse-mira { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); } 
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(124, 58, 237, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); } 
        }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="reg-menu" class="max-w-md w-full glass rounded-[3rem] premium-shadow overflow-hidden border border-white p-10 space-y-8 animate-fade-in">
        <div class="text-center space-y-3">
            <div class="w-20 h-20 bg-slate-900 rounded-[2rem] flex items-center justify-center mx-auto shadow-xl shadow-slate-200">
                <i class="fas fa-file-medical text-3xl text-indigo-400"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-900 tracking-tighter uppercase italic">Registrasi</h2>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Lengkapi Data Medis Pasien</p>
        </div>

        <div class="space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute left-5 top-5 text-indigo-500"></i>
                <input id="input-nama" type="text" placeholder="Nama Lengkap" class="w-full bg-slate-50 p-5 pl-14 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 font-bold text-sm border border-slate-100 transition-all">
            </div>
            <div class="relative">
                <i class="fas fa-door-open absolute left-5 top-5 text-indigo-500"></i>
                <input id="input-kamar" type="text" placeholder="Nomor Kamar" class="w-full bg-slate-50 p-5 pl-14 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 font-bold text-sm border border-slate-100 transition-all">
            </div>
            <div class="relative">
                <i class="fas fa-venus-mars absolute left-5 top-5 text-indigo-500"></i>
                <select id="input-jk" class="w-full bg-slate-50 p-5 pl-14 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 font-bold text-sm border border-slate-100 appearance-none cursor-pointer text-slate-500">
                    <option value="" disabled selected>Pilih Jenis Kelamin</option>
                    <option value="LAKI-LAKI">LAKI-LAKI</option>
                    <option value="PEREMPUAN">PEREMPUAN</option>
                </select>
            </div>
        </div>

        <button onclick="saveIdentity()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-6 rounded-3xl shadow-2xl transition-all active:scale-95 tracking-[0.3em] text-[10px] uppercase">
            Masuk ke Dashboard <i class="fas fa-arrow-right ml-2 text-indigo-400"></i>
        </button>
    </div>

    <div id="main-dashboard" class="hidden max-w-md w-full space-y-6 animate-fade-in relative">
        <div class="bg-slate-900 rounded-[3rem] p-8 text-white shadow-2xl relative overflow-hidden mt-4">
            <div class="relative z-10">
                <span id="display-jk-tag" class="text-[9px] bg-indigo-500 px-3 py-1 rounded-full font-black uppercase tracking-widest"></span>
                <h1 id="display-nama" class="text-3xl font-black mt-2 tracking-tighter italic uppercase"></h1>
                <p id="display-info" class="text-[10px] opacity-60 font-bold tracking-[0.2em] mt-1 uppercase italic"></p>
            </div>
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl text-7xl flex items-center justify-center opacity-10"><i class="fas fa-heartbeat"></i></div>
        </div>

        <div class="bg-white rounded-[3rem] p-8 shadow-xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-end">
                <h3 class="font-bold text-slate-800 text-sm italic tracking-tight uppercase">Status Cairan</h3>
                <span id="status-percent" class="text-4xl font-black text-indigo-600 tracking-tighter">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-600 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
            <p class="text-[9px] text-center text-slate-400 font-black uppercase tracking-[0.3em]">Batas Medis: 1500ml / Hari</p>
        </div>

        <div class="bg-white rounded-[3rem] p-8 shadow-xl border border-slate-100 space-y-5">
            <div class="flex items-center gap-4 mb-2">
                <img src="https://files.oaiusercontent.com/file-NAn10uR7t1360wTizU6mS87Y?se=2024-10-24T08%3A32%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D1293c373-c61d-407b-8c67-c1044e99f660.webp&sig=G07V1Z1eU3A50aZJm6R%2BeI69P5p5N0T0z9D0l8%2B9mY0%3D" 
                     class="w-14 h-14 object-cover rounded-full shadow-md border-2 border-indigo-100" alt="Nurse Logo">
                <div>
                    <h4 class="font-black text-slate-800 text-sm uppercase tracking-tight">Input Asupan</h4>
                    <p class="text-[9px] text-slate-400 font-bold italic">Sinkronisasi Cloud Aktif</p>
                </div>
            </div>
            <div class="flex gap-3">
                <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 bg-slate-50 p-5 rounded-2xl shadow-inner outline-none focus:ring-2 focus:ring-indigo-400 text-xl font-bold border border-slate-100 transition-all">
                <select id="fluid-type" class="bg-slate-50 p-5 rounded-2xl font-bold shadow-inner outline-none border border-slate-100 px-6 appearance-none cursor-pointer">
                    <option value="IN">MINUM</option>
                    <option value="OUT">URIN</option>
                </select>
            </div>
            <button onclick="addRecord()" id="btn-simpan" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-[2rem] shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 tracking-[0.2em] text-[10px]">
                <i class="fas fa-cloud-upload-alt"></i> SIMPAN & SINKRON
            </button>
        </div>

        <button onclick="toggleMira()" class="fixed bottom-8 right-8 mira-gradient w-16 h-16 rounded-full shadow-[0_10px_30px_rgba(99,102,241,0.5)] flex flex-col items-center justify-center text-white z-[100] border-4 border-white transition-all active:scale-90 mira-pulse overflow-hidden">
            <img src="https://files.oaiusercontent.com/file-NAn10uR7t1360wTizU6mS87Y?se=2024-10-24T08%3A32%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D1293c373-c61d-407b-8c67-c1044e99f660.webp&sig=G07V1Z1eU3A50aZJm6R%2BeI69P5p5N0T0z9D0l8%2B9mY0%3D" 
                 class="w-full h-full object-cover" alt="Mira Logo">
        </button>
    </div>

    <div id="mira-panel" class="hidden fixed inset-0 z-[110] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[85vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden animate-slide-up relative">
            <div class="mira-gradient p-8 text-white relative flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-white rounded-xl flex items-center justify-center border border-white/30 backdrop-blur-sm shadow-inner overflow-hidden">
                        <img src="https://files.oaiusercontent.com/file-NAn10uR7t1360wTizU6mS87Y?se=2024-10-24T08%3A32%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D1293c373-c61d-407b-8c67-c1044e99f660.webp&sig=G07V1Z1eU3A50aZJm6R%2BeI69P5p5N0T0z9D0l8%2B9mY0%3D" 
                             class="w-full h-full object-cover" alt="Nurse AI">
                    </div>
                    <div>
                        <h2 class="text-xl font-black">Mira.AI</h2>
                        <span class="text-[9px] font-bold opacity-80 uppercase tracking-widest">Asisten Perawat Pintar</span>
                    </div>
                </div>
                <button onclick="toggleMira()" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/40">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            </div>
    </div>

    <script>
        // Logika JavaScript (saveIdentity, addRecord, toggleMira, dll) tetap sama
        function saveIdentity() {
            const nama = document.getElementById('input-nama').value;
            const kamar = document.getElementById('input-kamar').value;
            const jk = document.getElementById('input-jk').value;
            
            if(!nama || !kamar || !jk) return alert('Lengkapi data!');
            
            document.getElementById('display-nama').innerText = nama;
            document.getElementById('display-info').innerText = `KAMAR ${kamar} • RSUD LUXURY`;
            document.getElementById('display-jk-tag').innerText = jk;
            
            document.getElementById('reg-menu').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
        }

        function toggleMira() {
            const panel = document.getElementById('mira-panel');
            panel.classList.toggle('hidden');
        }

        function addRecord() {
            const amount = document.getElementById('fluid-amount').value;
            if(!amount) return;
            
            // Logika progress bar sederhana
            const currentPercent = parseInt(document.getElementById('status-percent').innerText);
            const newPercent = Math.min(currentPercent + 10, 100);
            
            document.getElementById('status-percent').innerText = newPercent + '%';
            document.getElementById('progress-bar').style.width = newPercent + '%';
            document.getElementById('fluid-amount').value = '';
            
            alert('Data berhasil disinkronkan ke Cloud!');
        }
    </script>
</body>
</html>
