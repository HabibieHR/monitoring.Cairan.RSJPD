<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health - Daily Fluid Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fdfdff; }
        .card-shadow { box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .mira-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .progress-ring { transition: stroke-dashoffset 0.35s; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .btn-primary { background: #1e293b; transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full space-y-8">
        
        <div class="mira-gradient rounded-[2.5rem] p-8 text-white card-shadow relative overflow-hidden">
            <div class="relative z-10">
                <span class="text-[10px] bg-indigo-500/30 border border-indigo-400/30 px-3 py-1 rounded-full font-bold uppercase tracking-widest">Laki-Laki</span>
                <h1 class="text-4xl font-extrabold mt-3 tracking-tight italic">EDWARD</h1>
                <p class="text-[11px] opacity-60 font-medium tracking-[0.1em] mt-1 uppercase">Kamar 091 • Luxury General Hospital</p>
            </div>
            <div class="absolute -right-4 -bottom-4 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl"></div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 card-shadow border border-slate-50 flex flex-col items-center text-center">
            <h3 class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-6">Daily Fluid Balance</h3>
            
            <div class="relative inline-flex items-center justify-center">
                <svg class="w-48 h-48">
                    <circle class="text-slate-100" stroke-width="12" stroke="currentColor" fill="transparent" r="80" cx="96" cy="96" />
                    <circle id="progress-circle" class="text-indigo-600 progress-ring" stroke-width="12" stroke-dasharray="502.4" stroke-dashoffset="502.4" stroke-linecap="round" stroke="currentColor" fill="transparent" r="80" cx="96" cy="96" />
                </svg>
                <div class="absolute flex flex-col items-center">
                    <span id="percent-text" class="text-5xl font-black text-slate-800">0%</span>
                    <span class="text-[10px] text-slate-400 font-medium mt-1">Total Intake vs. Daily Limit</span>
                </div>
            </div>
            
            <p class="mt-6 text-[11px] font-bold text-indigo-500 uppercase tracking-[0.2em]">Target Intake: 1500 ml</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 card-shadow border border-slate-50">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center border border-slate-100 shadow-sm">
                    <i class="fas fa-user-nurse text-indigo-500 text-xl"></i>
                </div>
                <div>
                    <h4 class="font-extrabold text-slate-800 text-sm uppercase">Add Intake</h4>
                    <p class="text-[10px] text-slate-400 font-semibold"><i class="fas fa-cloud text-[8px] mr-1"></i> Cloud Syncing</p>
                </div>
            </div>

            <div class="flex gap-3">
                <input id="ml-input" type="number" placeholder="ml" class="flex-1 bg-slate-50 p-5 rounded-2xl outline-none border border-slate-100 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 font-bold text-lg transition-all">
                <button onclick="addFluid()" class="btn-primary text-white px-8 rounded-2xl font-extrabold text-xs uppercase tracking-widest shadow-lg shadow-slate-200">
                    Drink
                </button>
            </div>
        </div>

        <div class="flex justify-end pr-2">
            <div class="bg-indigo-600 px-5 py-3 rounded-2xl shadow-xl shadow-indigo-200 flex items-center gap-3 border border-white/20">
                <div class="w-6 h-6 bg-white/20 rounded-lg flex items-center justify-center">
                    <i class="fas fa-wave-square text-[10px] text-white"></i>
                </div>
                <span class="text-white font-black text-xs tracking-tighter">Mira Health</span>
            </div>
        </div>

    </div>

    <script>
        let currentTotal = 0;
        const target = 1500;
        const circle = document.getElementById('progress-circle');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        function setProgress(percent) {
            const offset = circumference - (percent / 100 * circumference);
            circle.style.strokeDashoffset = offset;
            document.getElementById('percent-text').innerText = Math.round(percent) + '%';
        }

        function addFluid() {
            const input = document.getElementById('ml-input');
            const value = parseInt(input.value);

            if (value > 0) {
                currentTotal += value;
                let percent = (currentTotal / target) * 100;
                if (percent > 100) percent = 100;
                
                setProgress(percent);
                input.value = '';
                
                // Feedback visual sederhana
                console.log(`Added ${value}ml. Total: ${currentTotal}ml`);
            } else {
                alert("Masukkan jumlah ml yang valid");
            }
        }

        // Inisialisasi
        setProgress(0);
    </script>
</body>
</html>
