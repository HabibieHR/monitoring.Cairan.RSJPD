<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health Pro - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .clinical-card { background: #ffffff; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
        .mira-accent { background: #4f46e5; }
        .status-pill { padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-normal { background: #f0fdf4; color: #166534; }
        .status-loading { background: #fefce8; color: #854d0e; }
        .status-critical { background: #fef2f2; color: #991b1b; animation: pulseRed 1.5s infinite; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
        
        .loader { border-top-color: #4f46e5; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full space-y-5 relative">
        
        <div id="display-profile" class="hidden clinical-card p-5 flex justify-between items-center animate-fade">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-500">
                    <i class="fas fa-user-circle text-2xl"></i>
                </div>
                <div>
                    <h2 id="patient-name" class="font-extrabold text-lg leading-none text-slate-900 uppercase"></h2>
                    <p id="patient-room" class="text-[10px] text-indigo-600 mt-1 font-bold tracking-widest uppercase"></p>
                </div>
            </div>
            <button onclick="resetApp()" class="text-slate-300 hover:text-red-500 p-2 transition-colors">
                <i class="fas fa-power-off"></i>
            </button>
        </div>

        <div id="main-dashboard" class="hidden space-y-5 animate-fade">
            <div class="clinical-card p-8 text-center space-y-6">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Data Cloud Hari Ini</span>
                    <span id="status-tag" class="status-pill status-loading">Sinkronisasi...</span>
                </div>
                
                <div class="py-2">
                    <span id="percent-display" class="text-7xl font-black tracking-tighter text-slate-900">0<small class="text-2xl text-slate-300">%</small></span>
                </div>
                
                <div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden shadow-inner">
                    <div id="progress-bar" class="mira-accent h-full w-0 transition-all duration-1000 ease-out"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-50">
                    <div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Masuk</p>
                        <p class="text-base font-black text-indigo-600"><span id="intake-display">0</span><small class="ml-0.5 text-[10px]">ml</small></p>
                    </div>
                    <div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Keluar</p>
                        <p class="text-base font-black text-slate-800"><span id="output-display">0</span><small class="ml-0.5 text-[10px]">ml</small></p>
                    </div>
                    <div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">Balance</p>
                        <p id="balance-display" class="text-base font-black text-emerald-600">0<small class="ml-0.5 text-[10px]">ml</small></p>
                    </div>
                </div>
            </div>

            <div class="clinical-card p-6 space-y-4">
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Jumlah (ml)</label>
                        <input id="fluid-amount" type="number" inputmode="numeric" placeholder="0" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl font-black text-2xl outline-none focus:ring-2 focus:ring-indigo-100 transition-all">
                    </div>
                    <div class="w-1/3">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Tipe</label>
                        <select id="fluid-type" class="w-full h-[66px] bg-slate-50 border border-slate-200 px-3 rounded-2xl font-bold text-sm outline-none appearance-none">
                            <option value="IN">💧 Masuk</option>
                            <option value="OUT">🚽 Keluar</option>
                        </select>
                    </div>
                </div>
                <button id="submit-btn" onclick="addRecord()" class="w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-lg shadow-indigo-100 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3 uppercase text-xs tracking-widest">
                    Catat ke Cloud
                </button>
            </div>
        </div>

        <div id="setup-form" class="clinical-card p-10 space-y-8 animate-fade text-center">
            <div class="space-y-2">
                <div class="w-16 h-16 mira-accent rounded-2xl flex items-center justify-center mx-auto text-white shadow-xl shadow-indigo-100">
                    <i class="fas fa-notes-medical text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-slate-900">MIRA HEALTH</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Cloud Patient Monitoring</p>
            </div>
            <div class="space-y-3">
                <input id="input-name" type="text" placeholder="Nama Lengkap Pasien" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-semibold outline-none focus:border-indigo-400">
                <input id="input-room" type="text" placeholder="Nomor Kamar" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl font-semibold outline-none focus:border-indigo-400">
            </div>
            <button onclick="saveIdentity()" class="w-full mira-accent text-white font-bold py-5 rounded-xl shadow-lg uppercase text-xs tracking-widest">
                Daftar & Hubungkan
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyilbUEyIqqcu-3q8uMZhD7wC7-1hIQf-355TBXC1HHO4FihCeBlgVE9m70hrQqK_lA/exec";
        const DAILY_LIMIT = 1500;

        // 1. Sinkronisasi Awal dari Cloud
        async function syncWithCloud() {
            const name = localStorage.getItem('mira_name');
            const room = localStorage.getItem('mira_room');
            if(!name || !room) return;

            setLoading(true);
            try {
                const response = await fetch(`${GAS_URL}?name=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}`);
                const data = await response.json();
                updateDisplay(data.totalIn || 0, data.totalOut || 0);
            } catch (e) {
                console.error("Sync Error:", e);
                document.getElementById('status-tag').innerText = "⚠️ Offline";
            } finally {
                setLoading(false);
            }
        }

        // 2. Kirim Data Baru ke Cloud
        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const type = document.getElementById('fluid-type').value;
            const amount = parseInt(amountInput.value);
            const btn = document.getElementById('submit-btn');

            if(!amount || amount <= 0) return amountInput.classList.add('border-red-400');
            amountInput.classList.remove('border-red-400');

            const name = localStorage.getItem('mira_name');
            const room = localStorage.getItem('mira_room');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Memproses...`;

            try {
                // Gunakan mode: 'cors' jika script Anda sudah mengizinkan, 
                // jika tidak, hasil .json() mungkin gagal di beberapa browser (opaque).
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        type: "SAVE_RECORD",
                        name: name,
                        room: room,
                        fluidType: type === 'IN' ? 'Minum/Infus' : 'Urin',
                        amount: amount
                    })
                });
                
                const result = await response.json();
                updateDisplay(result.totalIn, result.totalOut);
                
                amountInput.value = '';
                btn.innerHTML = `<i class="fas fa-check-circle"></i> Berhasil!`;
                btn.classList.replace('mira-accent', 'bg-emerald-500');
            } catch (e) {
                console.error("Upload Error:", e);
                btn.innerHTML = `<i class="fas fa-times-circle"></i> Gagal Cloud`;
                btn.classList.replace('mira-accent', 'bg-rose-500');
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = `Catat ke Cloud`;
                    btn.className = "w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-lg uppercase text-xs tracking-widest transition-all flex items-center justify-center gap-3";
                }, 2500);
            }
        }

        // 3. Update Visual Dashboard
        function updateDisplay(tin, tout) {
            const balance = tin - tout;
            const percent = Math.min((tin / DAILY_LIMIT) * 100, 100);

            document.getElementById('intake-display').innerText = tin.toLocaleString('id-ID');
            document.getElementById('output-display').innerText = tout.toLocaleString('id-ID');
            document.getElementById('balance-display').innerText = `${balance.toLocaleString('id-ID')}ml`;
            document.getElementById('percent-display').innerHTML = `${Math.round(percent)}<small class="text-2xl text-slate-300">%</small>`;
            
            const pb = document.getElementById('progress-bar');
            pb.style.width = percent + '%';
            
            const tag = document.getElementById('status-tag');
            if(percent >= 100) {
                tag.innerText = "🚨 Batas Tercapai";
                tag.className = "status-pill status-critical";
                pb.className = "bg-rose-600 h-full transition-all duration-1000";
            } else {
                tag.innerText = "✅ Sinkron";
                tag.className = "status-pill status-normal";
                pb.className = "mira-accent h-full transition-all duration-1000";
            }
        }

        // --- Helper ---
        function setLoading(state) {
            const tag = document.getElementById('status-tag');
            if(state) {
                tag.innerText = "🔄 Sinkron...";
                tag.className = "status-pill status-loading";
            }
        }

        function saveIdentity() {
            const n = document.getElementById('input-name').value.trim();
            const r = document.getElementById('input-room').value.trim();
            if(!n || !r) return alert("Isi data lengkap!");
            localStorage.setItem('mira_name', n.toUpperCase());
            localStorage.setItem('mira_room', r.toUpperCase());
            location.reload();
        }

        function checkUser() {
            const name = localStorage.getItem('mira_name');
            if(name) {
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('display-profile').classList.remove('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('patient-name').innerText = name;
                document.getElementById('patient-room').innerText = `KAMAR ${localStorage.getItem('mira_room')}`;
                syncWithCloud();
            }
        }

        function resetApp() { if(confirm("Hapus sesi dan keluar?")) { localStorage.clear(); location.reload(); } }

        document.addEventListener('DOMContentLoaded', checkUser);
    </script>
</body>
</html>
