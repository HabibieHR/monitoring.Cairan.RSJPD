<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #0f172a; /* Deep Navy Background */
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* Card Bergaya Premium Dark */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        /* Tombol Aksi Mewah */
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(2, 132, 199, 0.4); }

        /* Input Minimalist */
        .input-dark {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
        }
        .input-dark:focus { border-color: #38bdf8; background: rgba(15, 23, 42, 0.9); }

        /* Status & Badge */
        .badge-live {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 99px;
            letter-spacing: 1px;
        }

        /* Animasi Progress */
        .progress-fill {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            border-radius: 99px;
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* Chat Widget Modern */
        #ai-trigger {
            background: #f8fafc;
            color: #0f172a;
            width: 56px; height: 56px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        #mira-ai-panel {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-md mx-auto space-y-6">
        
        <header id="header-profile" class="hidden flex justify-between items-center px-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-sky-400 to-indigo-500 flex items-center justify-center">
                    <i class="fas fa-user-md text-white"></i>
                </div>
                <div>
                    <h2 id="patient-name-top" class="text-sm font-bold tracking-tight"></h2>
                    <div class="flex items-center gap-2">
                        <span class="badge-live uppercase" id="patient-room-top"></span>
                    </div>
                </div>
            </div>
            <button onclick="resetApp()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-red-400 transition-colors">
                <i class="fas fa-power-off"></i>
            </button>
        </header>

        <div id="setup-view" class="hidden glass-card p-10 space-y-8 animate-fade text-center">
            <div class="space-y-2">
                <h1 class="text-3xl font-extrabold tracking-tighter bg-gradient-to-r from-white to-slate-500 bg-clip-text text-transparent">Mira Health.</h1>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-[0.3em]">Precision Monitoring</p>
            </div>
            <div class="space-y-4 pt-4">
                <input id="input-name" type="text" placeholder="Full Patient Name" class="input-dark w-full p-4 rounded-2xl outline-none text-sm font-semibold">
                <input id="input-room" type="text" placeholder="Ward / Bed Number" class="input-dark w-full p-4 rounded-2xl outline-none text-sm font-semibold">
                <button onclick="saveIdentity()" class="btn-primary w-full p-4 rounded-2xl font-bold text-sm uppercase tracking-widest mt-4">
                    Initialize System
                </button>
            </div>
        </div>

        <main id="main-view" class="hidden space-y-6">
            
            <section class="glass-card p-8 relative overflow-hidden">
                <div class="flex justify-between items-start mb-10">
                    <span class="badge-live">Real-time Data</span>
                    <i class="fas fa-ellipsis-v text-slate-500"></i>
                </div>

                <div class="flex flex-col items-center justify-center space-y-2">
                    <div class="relative">
                        <span id="percent-display" class="text-8xl font-extrabold tracking-tighter tabular-nums">0<small class="text-xl text-slate-500">%</small></span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Daily Hydration Goal</p>
                </div>

                <div class="mt-10 space-y-2">
                    <div class="w-full bg-slate-900/50 h-2.5 rounded-full overflow-hidden p-0.5 border border-white/5">
                        <div id="progress-bar" class="progress-fill h-full w-0"></div>
                    </div>
                    <div class="flex justify-between text-[10px] font-bold text-slate-500 px-1">
                        <span>CURRENT: <b class="text-sky-400" id="current-ml">0 ML</b></span>
                        <span>TARGET: 1.500 ML</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-10">
                    <div class="bg-slate-900/40 p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[9px] font-bold text-slate-500 uppercase mb-1">Intake</p>
                        <p class="text-sm font-bold" id="val-in">0</p>
                    </div>
                    <div class="bg-slate-900/40 p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[9px] font-bold text-slate-500 uppercase mb-1">Output</p>
                        <p class="text-sm font-bold" id="val-out">0</p>
                    </div>
                    <div class="bg-sky-500/10 p-4 rounded-2xl border border-sky-500/20 text-center">
                        <p class="text-[9px] font-bold text-sky-400 uppercase mb-1">Balance</p>
                        <p class="text-sm font-bold text-sky-400" id="val-net">0</p>
                    </div>
                </div>
            </section>

            <section class="glass-card p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest ml-1">Volume (ML)</label>
                        <input id="fluid-amt" type="number" placeholder="250" class="input-dark w-full p-4 rounded-2xl font-bold text-2xl outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest ml-1">Type</label>
                        <select id="fluid-cat" class="input-dark w-full h-[68px] px-3 rounded-2xl font-bold text-xs outline-none appearance-none">
                            <option value="IN">💧 INTAKE</option>
                            <option value="OUT">🚽 OUTPUT</option>
                        </select>
                    </div>
                </div>
                <button id="sync-btn" onclick="addRecord()" class="btn-primary w-full p-5 rounded-2xl font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-3">
                    <i class="fas fa-bolt"></i> Log to Cloud
                </button>
            </section>

            <section class="glass-card p-6">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6 px-1">Weekly Fluid Dynamics</h3>
                <div class="h-40"><canvas id="weeklyChart"></canvas></div>
            </section>
        </main>
    </div>

    <div id="ai-trigger" onclick="toggleChat()" class="fixed bottom-8 right-8 rounded-full flex items-center justify-center cursor-pointer hover:scale-110 transition-all z-[100]">
        <i class="fas fa-robot text-xl"></i>
    </div>

    <div id="mira-ai-panel" class="fixed bottom-28 right-6 w-80 h-[450px] rounded-3xl hidden flex-col overflow-hidden z-[100] border border-white/10 animate-fade">
        <div class="p-5 bg-slate-800/80 border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 bg-sky-400 rounded-full animate-pulse"></div>
                <span class="text-xs font-bold tracking-tight">Mira Intelligence</span>
            </div>
            <button onclick="toggleChat()" class="text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <div id="chat-win" class="flex-1 overflow-y-auto p-4 space-y-4 text-[12px] leading-relaxed no-scrollbar">
            <div class="bg-slate-800 p-3 rounded-2xl rounded-bl-none border border-white/5">
                Sistem aktif. Saya Mira, asisten klinis Anda. Bagaimana kondisi Anda hari ini?
            </div>
        </div>
        <div id="typing-ui" class="hidden px-4 py-2 text-[10px] text-sky-400 font-bold animate-pulse">Analysing Clinical Data...</div>
        <div class="p-4 bg-slate-900/50">
            <div class="flex bg-slate-800 rounded-xl p-2 items-center">
                <input id="user-input" type="text" placeholder="Ask about health..." class="bg-transparent border-none outline-none text-xs flex-1 px-2 text-white">
                <button onclick="askAI()" class="text-sky-400 p-2"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const CFG = {
            API: "AIzaSyBRGjF_AsDdN7lU-gy1KMZ4mqXawzv-nSc",
            GAS: "https://script.google.com/macros/s/AKfycbyilbUEyIqqcu-3q8uMZhD7wC7-1hIQf-355TBXC1HHO4FihCeBlgVE9m70hrQqK_lA/exec",
            GOAL: 1500
        };
        let chart = null;

        async function init() {
            const n = localStorage.getItem('mira_name');
            const r = localStorage.getItem('mira_room');
            if(!n) return document.getElementById('setup-view').classList.remove('hidden');

            document.getElementById('header-profile').classList.remove('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('patient-name-top').innerText = n;
            document.getElementById('patient-room-top').innerText = r;

            try {
                const res = await fetch(`${CFG.GAS}?name=${encodeURIComponent(n)}&room=${encodeURIComponent(r)}`);
                const data = await res.json();
                updateUI(data.totalIn || 0, data.totalOut || 0);
                if(data.weekly) renderChart(data.weekly);
            } catch(e) { console.error(e); }
        }

        function updateUI(tin, tout) {
            const net = tin - tout;
            const pc = Math.min((tin / CFG.GOAL) * 100, 100);
            document.getElementById('current-ml').innerText = `${tin} ML`;
            document.getElementById('val-in').innerText = tin;
            document.getElementById('val-out').innerText = tout;
            document.getElementById('val-net').innerText = net;
            document.getElementById('percent-display').innerHTML = `${Math.round(pc)}<small class="text-xl text-slate-500">%</small>`;
            document.getElementById('progress-bar').style.width = pc + '%';
        }

        async function addRecord() {
            const amt = document.getElementById('fluid-amt');
            const cat = document.getElementById('fluid-cat').value;
            const btn = document.getElementById('sync-btn');
            if(!amt.value || amt.value <= 0) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> SYNCING...`;

            try {
                const res = await fetch(CFG.GAS, {
                    method: 'POST',
                    body: JSON.stringify({
                        type: "SAVE_RECORD",
                        name: localStorage.getItem('mira_name'),
                        room: localStorage.getItem('mira_room'),
                        fluidType: cat === 'IN' ? 'Minum/Infus' : 'Urin',
                        amount: parseInt(amt.value)
                    })
                });
                const d = await res.json();
                updateUI(d.totalIn, d.totalOut);
                amt.value = '';
                btn.innerHTML = `<i class="fas fa-check"></i> SUCCESS`;
            } catch(e) { btn.innerHTML = `FAILED`; }
            finally { setTimeout(() => { btn.disabled = false; btn.innerHTML = `<i class="fas fa-bolt"></i> Log to Cloud`; }, 2000); }
        }

        async function askAI() {
            const inp = document.getElementById('user-input');
            const win = document.getElementById('chat-win');
            const type = document.getElementById('typing-ui');
            const txt = inp.value.trim();
            if(!txt) return;

            win.innerHTML += `<div class="bg-sky-500/20 p-3 rounded-2xl rounded-br-none border border-sky-500/10 text-right ml-8">${txt}</div>`;
            inp.value = '';
            type.classList.remove('hidden');
            win.scrollTop = win.scrollHeight;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CFG.API}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `
                            PRO MODE: You are Mira, a high-end medical assistant at RSJPD.
                            DATA: Intake ${document.getElementById('val-in').innerText}ml, Output ${document.getElementById('val-out').innerText}ml.
                            TONE: Professional, succinct, Swiss-clinic style (cold but caring). Max 2 sentences.
                            USER: ${txt}` 
                        }] }]
                    })
                });
                const d = await res.json();
                const reply = d.candidates[0].content.parts[0].text;
                type.classList.add('hidden');
                win.innerHTML += `<div class="bg-slate-800 p-3 rounded-2xl rounded-bl-none border border-white/5 mr-8">${reply}</div>`;
                win.scrollTop = win.scrollHeight;
            } catch(e) { type.classList.add('hidden'); }
        }

        function renderChart(h) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: h.labels,
                    datasets: [{
                        data: h.values,
                        borderColor: '#38bdf8',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: true,
                        backgroundColor: (c) => {
                            const g = c.chart.ctx.createLinearGradient(0,0,0,200);
                            g.addColorStop(0, 'rgba(56, 189, 248, 0.2)');
                            g.addColorStop(1, 'transparent');
                            return g;
                        }
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false }, 
                        x: { grid: { display: false }, ticks: { color: '#475569', font: { size: 9, weight: 'bold' } } } 
                    }
                }
            });
        }

        function saveIdentity() {
            const n = document.getElementById('input-name').value;
            const r = document.getElementById('input-room').value;
            if(n && r) { localStorage.setItem('mira_name', n.toUpperCase()); localStorage.setItem('mira_room', r.toUpperCase()); location.reload(); }
        }
        function toggleChat() { const p = document.getElementById('mira-ai-panel'); p.classList.toggle('hidden'); p.classList.toggle('flex'); }
        function resetApp() { if(confirm("Terminate Session?")) { localStorage.clear(); location.reload(); } }
        
        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') askAI(); });
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
