<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health - AI Clinical Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); }
        .mira-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .premium-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass rounded-[3rem] premium-shadow overflow-hidden border border-white relative">
        
        <div id="setup-form" class="p-10 space-y-8">
            <div class="text-center space-y-4">
                <div class="w-24 h-24 bg-slate-900 rounded-[2.5rem] flex items-center justify-center mx-auto shadow-2xl overflow-hidden border-4 border-white">
                    <img src="https://files.oaiusercontent.com/file-NAn10uR7t1360wTizU6mS87Y?se=2024-10-24T08%3A32%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D1293c373-c61d-407b-8c67-c1044e99f660.webp&sig=G07V1Z1eU3A50aZJm6R%2BeI69P5p5N0T0z9D0l8%2B9mY0%3D" class="w-full h-full object-cover" alt="Mira Logo">
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tighter uppercase italic">Registrasi</h2>
            </div>
            <div class="space-y-4">
                <input id="input-nama" type="text" placeholder="Nama Pasien" class="w-full bg-slate-50 p-5 rounded-2xl outline-none border border-slate-100 font-bold text-sm focus:ring-2 focus:ring-indigo-400">
                <input id="input-kamar" type="text" placeholder="Nomor Kamar" class="w-full bg-slate-50 p-5 rounded-2xl outline-none border border-slate-100 font-bold text-sm focus:ring-2 focus:ring-indigo-400">
                <select id="input-jk" class="w-full bg-slate-50 p-5 rounded-2xl outline-none border border-slate-100 font-bold text-sm focus:ring-2 focus:ring-indigo-400">
                    <option value="LAKI-LAKI">LAKI-LAKI</option>
                    <option value="PEREMPUAN">PEREMPUAN</option>
                </select>
            </div>
            <button onclick="saveIdentity()" class="w-full bg-slate-900 text-white font-bold py-6 rounded-3xl tracking-[0.3em] text-[10px] uppercase">Mulai Monitoring</button>
        </div>

        <div id="main-dashboard" class="hidden">
            <div class="bg-slate-900 p-8 text-white">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="display-jk-tag" class="text-[9px] bg-indigo-500 px-3 py-1 rounded-full font-black uppercase tracking-widest"></span>
                        <h1 id="display-nama" class="text-3xl font-black tracking-tighter italic uppercase mt-2"></h1>
                        <p id="display-info" class="text-[10px] opacity-60 font-bold uppercase"></p>
                    </div>
                    <button onclick="resetApp()" class="text-white/40 hover:text-red-400"><i class="fas fa-power-off"></i></button>
                </div>
            </div>

            <div class="p-8 space-y-6 bg-white rounded-t-[3rem] -mt-6 relative z-20">
                <div class="space-y-4 text-center">
                    <span id="status-percent" class="text-5xl font-black text-indigo-600 tracking-tighter">0%</span>
                    <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                        <div id="progress-bar" class="mira-gradient h-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>

                <div class="bg-slate-50 p-6 rounded-[2.5rem] border border-slate-100 space-y-4">
                    <div class="flex gap-2">
                        <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 bg-white p-4 rounded-xl shadow-sm outline-none font-bold">
                        <select id="fluid-type" class="bg-white p-4 rounded-xl font-bold shadow-sm outline-none">
                            <option value="IN">MINUM</option>
                            <option value="OUT">URIN</option>
                        </select>
                    </div>
                    <button onclick="addRecord()" id="btn-simpan" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl text-[10px] uppercase tracking-widest">Simpan & Sinkron</button>
                </div>
            </div>
        </div>
    </div>

    <button onclick="toggleChat()" id="mira-fab" class="hidden fixed bottom-8 right-8 w-16 h-16 rounded-full mira-gradient shadow-2xl border-4 border-white flex items-center justify-center transition-transform active:scale-90 z-[100] overflow-hidden">
        <img src="https://files.oaiusercontent.com/file-NAn10uR7t1360wTizU6mS87Y?se=2024-10-24T08%3A32%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D1293c373-c61d-407b-8c67-c1044e99f660.webp&sig=G07V1Z1eU3A50aZJm6R%2BeI69P5p5N0T0z9D0l8%2B9mY0%3D" class="w-full h-full object-cover">
    </button>

    <div id="chat-panel" class="hidden fixed inset-0 z-[110] bg-slate-900/60 backdrop-blur-sm flex items-end justify-center p-4">
        <div class="bg-white w-full max-w-md h-[75vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden animate-slide-up">
            <div class="mira-gradient p-6 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-xl overflow-hidden shadow-lg border border-white/20">
                        <img src="https://files.oaiusercontent.com/file-NAn10uR7t1360wTizU6mS87Y?se=2024-10-24T08%3A32%3A46Z&sp=r&sv=2024-08-04&sr=b&rscc=max-age%3D604800%2C%20immutable%2C%20private&rscd=attachment%3B%20filename%3D1293c373-c61d-407b-8c67-c1044e99f660.webp&sig=G07V1Z1eU3A50aZJm6R%2BeI69P5p5N0T0z9D0l8%2B9mY0%3D" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h3 class="font-black text-sm uppercase">Mira.AI</h3>
                        <span class="text-[8px] font-bold opacity-70 tracking-widest uppercase">Clinical Agent Active</span>
                    </div>
                </div>
                <button onclick="toggleChat()" class="text-white/60 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 chat-container bg-slate-50/50">
                <div class="flex gap-3 max-w-[85%] animate-fade-in">
                    <div class="w-8 h-8 rounded-lg mira-gradient flex-shrink-0 flex items-center justify-center text-[10px] text-white font-bold">M</div>
                    <div class="bg-white p-4 rounded-[1.5rem] rounded-tl-none shadow-sm border border-slate-100">
                        <p class="text-xs font-bold text-slate-800 leading-relaxed">Halo! Saya Mira.AI. Ada yang bisa saya bantu terkait kondisi asupan cairan Anda hari ini?</p>
                    </div>
                </div>
            </div>

            <div class="p-6 bg-white border-t border-slate-100 flex gap-2">
                <input id="chat-input" type="text" placeholder="Tanya Mira..." class="flex-1 bg-slate-100 p-4 rounded-2xl outline-none text-xs font-bold focus:ring-2 focus:ring-indigo-400">
                <button onclick="sendMessage()" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center transition-all active:scale-90 shadow-lg">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG9e0tsti2INZDDcM-HPMO29nojxFxebmRUDz_rR_ZilbNBggWoDTKyc5yxJwMnPtV/exec";
        const LIMIT_HARIAN = 1500;

        function saveIdentity() {
            const nama = document.getElementById('input-nama').value;
            const kamar = document.getElementById('input-kamar').value;
            const jk = document.getElementById('input-jk').value;
            if(!nama || !kamar) return alert("Lengkapi data!");
            localStorage.setItem('pasien_nama', nama.toUpperCase());
            localStorage.setItem('pasien_kamar', kamar);
            localStorage.setItem('pasien_jk', jk);
            checkUser();
        }

        function checkUser() {
            const nama = localStorage.getItem('pasien_nama');
            if(nama) {
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('mira-fab').classList.remove('hidden');
                document.getElementById('display-nama').innerText = nama;
                document.getElementById('display-jk-tag').innerText = localStorage.getItem('pasien_jk');
                document.getElementById('display-info').innerText = `Kamar ${localStorage.getItem('pasien_kamar')} • RSUD Luxury`;
                updateUI();
            }
        }

        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const amount = parseInt(amountInput.value);
            const type = document.getElementById('fluid-type').value;
            if(!amount || amount <= 0) return alert("Isi ml!");
            
            // Logika simpan cloud (no-cors)
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nama: localStorage.getItem('pasien_nama'), amount, type }) });

            if(type === 'IN') {
                let current = parseInt(localStorage.getItem('totalIn') || 0);
                localStorage.setItem('totalIn', current + amount);
            }
            updateUI();
            amountInput.value = '';
            alert("Data Tersinkron!");
        }

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const percent = Math.min((totalIn / LIMIT_HARIAN) * 100, 100);
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";
        }

        function toggleChat() {
            document.getElementById('chat-panel').classList.toggle('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            if(!input.value) return;

            // User Message
            box.innerHTML += `<div class="flex justify-end animate-fade-in"><div class="bg-indigo-600 text-white p-4 rounded-[1.5rem] rounded-tr-none shadow-md max-w-[85%]"><p class="text-xs font-bold leading-relaxed">${input.value}</p></div></div>`;
            
            const userQuery = input.value.toLowerCase();
            input.value = '';
            box.scrollTop = box.scrollHeight;

            // Mira AI logic (Simulasi Respons Cerdas)
            setTimeout(() => {
                const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
                let response = "Saya mengerti. Saya akan memantau data asupan Anda. Apakah ada keluhan spesifik seperti bengkak atau sesak napas?";
                
                if(userQuery.includes("status") || userQuery.includes("minum")) {
                    response = `Saat ini total asupan minum Anda adalah ${totalIn}ml dari target ${LIMIT_HARIAN}ml harian.`;
                }
                
                if(totalIn >= LIMIT_HARIAN) {
                    response = "Peringatan Medis! Total asupan Anda sudah mencapai batas maksimal 1500ml. Mohon stop minum sementara dan tunggu instruksi dokter.";
                }

                box.innerHTML += `<div class="flex gap-3 animate-fade-in"><div class="w-8 h-8 rounded-lg mira-gradient flex-shrink-0 flex items-center justify-center text-[10px] text-white font-bold">M</div><div class="bg-white p-4 rounded-[1.5rem] rounded-tl-none shadow-sm border border-slate-100"><p class="text-xs font-bold text-slate-800 leading-relaxed">${response}</p></div></div>`;
                box.scrollTop = box.scrollHeight;
            }, 800);
        }

        function resetApp() { localStorage.clear(); location.reload(); }
        checkUser();
    </script>
</body>
</html>
