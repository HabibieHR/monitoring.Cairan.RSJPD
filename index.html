<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - Drive Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
        
        <div id="setup-form" class="p-6 space-y-4">
            <h2 class="text-xl font-bold text-gray-800 text-center">Registrasi Pasien</h2>
            <input id="input-nama" type="text" placeholder="Nama Lengkap" class="w-full border p-3 rounded-lg">
            <input id="input-kamar" type="text" placeholder="Nomor Kamar" class="w-full border p-3 rounded-lg">
            <select id="input-jk" class="w-full border p-3 rounded-lg">
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
            <button onclick="saveIdentity()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg">Mulai Monitoring</button>
        </div>

        <div id="main-dashboard" class="hidden">
            <div class="bg-slate-800 p-5 text-white">
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <p>Pasien: <span id="display-nama" class="font-bold"></span></p>
                    <p>Kamar: <span id="display-kamar" class="font-bold"></span></p>
                </div>
            </div>

            <div class="p-6">
                <div class="flex justify-between mb-2 text-sm font-medium">
                    <span>Status Input Harian</span>
                    <span id="status-percent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4 mb-6">
                    <div id="progress-bar" class="bg-green-500 h-4 rounded-full transition-all" style="width: 0%"></div>
                </div>

                <div class="space-y-4">
                    <div class="flex gap-2">
                        <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 border p-3 rounded-xl text-lg font-bold">
                        <select id="fluid-type" class="border p-3 rounded-xl">
                            <option value="IN">Minum</option>
                            <option value="OUT">Urin</option>
                        </select>
                    </div>
                    <button id="btn-simpan" onclick="addRecord()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg">
                        SIMPAN & KIRIM KE DRIVE
                    </button>
                </div>
            </div>
            
            <div class="p-6 bg-gray-50 border-t">
                <p class="text-xs text-gray-500 italic">Data akan otomatis tersimpan di Google Drive Dokter.</p>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3rorMz_9deDLUeiW8dTQ_1fAMUmxYSI6JS-py85j9gbPCs3pxJkE9ZNT_EMzuxuXR/exec"; // GANTI INI!

        function saveIdentity() {
            const nama = document.getElementById('input-nama').value;
            const kamar = document.getElementById('input-kamar').value;
            const jk = document.getElementById('input-jk').value;

            if(!nama || !kamar) return alert("Mohon lengkapi data!");

            localStorage.setItem('pasien_nama', nama);
            localStorage.setItem('pasien_kamar', kamar);
            localStorage.setItem('pasien_jk', jk);
            checkUser();
        }

        function checkUser() {
            const nama = localStorage.getItem('pasien_nama');
            if(nama) {
                document.getElementById('setup-form').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                document.getElementById('display-nama').innerText = nama;
                document.getElementById('display-kamar').innerText = localStorage.getItem('pasien_kamar');
                updateUI();
            }
        }

        async function addRecord() {
            const amount = document.getElementById('fluid-amount').value;
            const type = document.getElementById('fluid-type').value;
            const btn = document.getElementById('btn-simpan');

            if(!amount) return;

            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const payload = {
                nama: localStorage.getItem('pasien_nama'),
                kamar: localStorage.getItem('pasien_kamar'),
                jk: localStorage.getItem('pasien_jk'),
                amount: amount,
                type: type
            };

            try {
                // Kirim ke Google Drive via Apps Script
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if(type === 'IN') {
                    let currentIn = parseInt(localStorage.getItem('totalIn') || 0);
                    localStorage.setItem('totalIn', currentIn + parseInt(amount));
                }
                
                alert("Data Tersimpan di Drive!");
                updateUI();
            } catch (e) {
                alert("Gagal kirim ke Drive, cek koneksi.");
            } finally {
                btn.disabled = false;
                btn.innerText = "SIMPAN & KIRIM KE DRIVE";
                document.getElementById('fluid-amount').value = '';
            }
        }

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const limit = 1500;
            const percent = Math.min((totalIn / limit) * 100, 100);
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";
        }

        checkUser();
    </script>
</body>
</html>
