<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - AI Nurse Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        .premium-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
        .ai-chat-bubble { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 pb-12 flex items-center justify-center">

    <div class="max-w-md w-full glass rounded-[3rem] premium-shadow overflow-hidden border border-white relative">
        
        <div id="main-dashboard">
            <div class="bg-slate-900 p-8 text-white">
                <div class="flex justify-between items-start">
                    <div class="space-y-1">
                        <span id="display-jk-tag" class="text-[10px] bg-blue-600 px-3 py-1 rounded-full font-bold uppercase tracking-widest">Laki-laki</span>
                        <h2 id="display-nama" class="text-2xl font-black leading-tight tracking-tight">Humaira</h2>
                        <p id="display-info" class="text-xs opacity-50 font-medium italic italic">Kamar: 001</p>
                    </div>
                    <div class="flex gap-2">
                         <div class="w-10 h-10 rounded-full bg-blue-500/20 border border-blue-500/30 flex items-center justify-center">
                            <i class="fas fa-robot text-blue-400"></i>
                         </div>
                    </div>
                </div>
            </div>

            <div class="p-8 -mt-8 glass rounded-t-[3rem] space-y-6">
                
                <div id="ai-advice-container" class="ai-chat-bubble hidden bg-blue-600 p-5 rounded-[2rem] text-white shadow-lg shadow-blue-200 relative overflow-hidden">
                    <div class="flex gap-3 items-start relative z-10">
                        <div class="bg-white/20 p-2 rounded-xl">
                            <i class="fas fa-comment-medical text-xl text-white"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm">Saran Suster AI:</h4>
                            <p id="ai-text" class="text-xs leading-relaxed opacity-90 mt-1 font-medium italic">Sedang menganalisa kondisi Anda...</p>
                        </div>
                    </div>
                    <div class="absolute -right-4 -bottom-4 w-16 h-16 bg-white/10 rounded-full"></div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-end px-1">
                        <h3 class="font-bold text-slate-800 text-sm">Status Input Harian</h3>
                        <span id="status-percent" class="text-2xl font-black text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden shadow-inner">
                        <div id="progress-bar" class="bg-blue-600 h-full transition-all duration-1000 ease-in-out shadow-[0_0_10px_rgba(37,99,235,0.4)]" style="width: 0%"></div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm space-y-4">
                    <div class="flex items-center gap-3">
                        <img src="https://cdn-icons-png.flaticon.com/512/3588/3588621.png" class="w-10 h-10" alt="Nurse">
                        <p class="text-xs font-bold text-slate-700">Berapa ml asupan Anda sekarang?</p>
                    </div>
                    <div class="flex gap-2">
                        <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 bg-slate-50 border-none p-4 rounded-2xl shadow-inner outline-none focus:ring-2 focus:ring-blue-400 text-lg font-bold">
                        <select id="fluid-type" class="bg-slate-50 border-none p-4 rounded-2xl font-bold shadow-inner outline-none appearance-none cursor-pointer">
                            <option value="IN">Minum</option>
                            <option value="OUT">Urin</option>
                        </select>
                    </div>
                    <button id="btn-simpan" onclick="addRecord()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2">
                        <i class="fas fa-check-circle"></i> SIMPAN DATA
                    </button>
                </div>
            </div>

            <div class="px-10 pb-8 text-center text-slate-400 font-bold text-[9px] uppercase tracking-[0.3em]">
                Integrated AI Medical Assistant
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG9e0tsti2INZDDcM-HPMO29nojxFxebmRUDz_rR_ZilbNBggWoDTKyc5yxJwMnPtV/exec";
        const LIMIT = 1500;

        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const amount = parseInt(amountInput.value);
            const type = document.getElementById('fluid-type').value;
            const btn = document.getElementById('btn-simpan');

            if(!amount || amount <= 0) return alert("Masukkan jumlah ml!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Suster AI sedang mencatat...`;

            try {
                // KIRIM DATA KE DRIVE
                const payload = {
                    nama: localStorage.getItem('pasien_nama') || "Humaira",
                    kamar: localStorage.getItem('pasien_kamar') || "001",
                    jk: localStorage.getItem('pasien_jk') || "Laki-laki",
                    amount: amount,
                    type: type
                };

                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });

                // UPDATE LOKAL
                if(type === 'IN') {
                    let currentIn = parseInt(localStorage.getItem('totalIn') || 0);
                    localStorage.setItem('totalIn', currentIn + amount);
                }

                // AKTIFKAN ANALISA AI
                updateUI(amount, type);
                amountInput.value = '';
                
            } catch (e) {
                alert("Gagal sinkronisasi.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-check-circle"></i> SIMPAN DATA`;
            }
        }

        function updateUI(lastAmount = 0, lastType = '') {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const percent = Math.min((totalIn / LIMIT) * 100, 100);
            
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";

            // LOGIKA AI AGENT (ANALISA MEDIS OTOMATIS)
            const aiContainer = document.getElementById('ai-advice-container');
            const aiText = document.getElementById('ai-text');
            aiContainer.classList.remove('hidden');

            let advice = "";
            
            if (percent >= 100) {
                advice = "STOP! Anda sudah mencapai batas maksimal 1500ml. Jika merasa sesak napas atau batuk saat berbaring, segera lapor ke perawat di kamar Anda.";
            } else if (percent >= 80) {
                advice = `Hati-hati, sisa kuota minum Anda tinggal ${LIMIT - totalIn}ml lagi. Gunakan gelas kecil dan hindari makanan asin agar tidak haus.`;
            } else if (lastType === 'IN' && lastAmount > 300) {
                advice = "Anda baru saja minum cukup banyak sekaligus. Untuk pasien gagal ginjal/jantung, sebaiknya minum sedikit-sedikit tapi sering agar jantung tidak terbebani.";
            } else {
                advice = "Catatan berhasil disimpan. Pastikan urin Anda tetap terpantau dan catat setiap ada pengeluaran cairan ya.";
            }

            aiText.innerText = advice;
        }

        // Jalankan UI saat load
        updateUI();
    </script>
</body>
</html>
