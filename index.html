<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan - Mira.AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); }
        .mira-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .mira-pulse { animation: pulse-mira 2s infinite; }
        @keyframes pulse-mira { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); } 70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4 space-y-6">
        
        <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <span id="display-jk-tag" class="text-[9px] bg-indigo-500 px-3 py-1 rounded-full font-black uppercase tracking-widest">Memuat...</span>
                <h1 id="display-nama" class="text-3xl font-black mt-2 tracking-tighter italic italic">HUMAIRA</h1>
                <p id="display-info" class="text-[10px] opacity-60 font-bold tracking-widest mt-1"></p>
            </div>
            <div class="absolute -right-4 -bottom-4 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-end">
                <h3 class="font-bold text-slate-800 text-sm italic italic">Status Cairan Harian</h3>
                <span id="status-percent" class="text-4xl font-black text-indigo-600 tracking-tighter">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-600 h-full transition-all duration-1000 shadow-lg" style="width: 0%"></div>
            </div>
            <p class="text-[10px] text-center text-slate-400 font-bold uppercase tracking-[0.2em]">Batas Aman: 1500ml / Hari</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 space-y-5">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-500">
                    <i class="fas fa-tint"></i>
                </div>
                <h4 class="font-black text-slate-800 text-sm">Input Asupan Baru</h4>
            </div>
            <div class="flex gap-3">
                <input id="fluid-amount" type="number" placeholder="ml" class="flex-1 bg-slate-50 p-4 rounded-2xl shadow-inner outline-none focus:ring-2 focus:ring-indigo-400 text-xl font-bold border border-slate-100">
                <select id="fluid-type" class="bg-slate-50 p-4 rounded-2xl font-bold shadow-inner outline-none border border-slate-100 px-6 appearance-none">
                    <option value="IN">Minum</option>
                    <option value="OUT">Urin</option>
                </select>
            </div>
            <button onclick="addRecord()" id="btn-simpan" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-3xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 tracking-widest text-[10px]">
                <i class="fas fa-cloud-upload-alt"></i> SIMPAN KE GSHEET
            </button>
        </div>
    </div>

    <button onclick="toggleMira()" class="fixed bottom-6 right-6 mira-gradient w-16 h-16 rounded-full shadow-[0_10px_30px_rgba(99,102,241,0.5)] flex flex-col items-center justify-center text-white mira-pulse z-[100] border-4 border-white transition-transform active:scale-90">
        <i class="fas fa-robot text-xl"></i>
        <span class="text-[8px] font-black uppercase mt-1">Mira.AI</span>
    </button>

    <div id="mira-panel" class="hidden fixed inset-0 z-[110] bg-slate-900/40 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[85vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden animate-slide-up relative">
            
            <div class="mira-gradient p-8 text-white relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 bg-white/20 rounded-2xl backdrop-blur-md flex items-center justify-center border border-white/30">
                            <i class="fas fa-brain text-2xl"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-black tracking-tight">Mira.AI</h2>
                            <p class="text-[10px] opacity-80 font-bold uppercase tracking-widest">Virtual Health Agent</p>
                        </div>
                    </div>
                    <button onclick="toggleMira()" class="w-10 h-10 bg-black/10 rounded-full flex items-center justify-center hover:bg-white/20 transition-all text-xl"><i class="fas fa-times"></i></button>
                </div>
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full"></div>
            </div>

            <div id="mira-messages" class="flex-1 p-8 overflow-y-auto space-y-6 chat-container bg-slate-50">
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-xl mira-gradient flex items-center justify-center text-white text-[10px] flex-shrink-0 mt-1"><i class="fas fa-robot"></i></div>
                    <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-xs font-medium text-slate-700 leading-relaxed italic italic">
                        Halo Humaira! Saya <b>Mira.AI</b>, asisten kesehatan pribadi Anda. Silakan tanyakan apa saja tentang asupan cairan Anda hari ini atau tips diet medis lainnya.
                    </div>
                </div>
            </div>

            <div class="p-6 bg-white border-t border-slate-100 flex gap-3 items-center">
                <input id="mira-input" type="text" placeholder="Tanyakan Mira.AI..." class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-purple-400 font-bold text-xs border border-slate-100 shadow-inner">
                <button onclick="askMira()" class="mira-gradient text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-purple-200 transition-all active:scale-90"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
    </script>
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // CONFIG (Kunci Gemini Anda Sudah Terpasang)
        const API_KEY = "AIzaSyAdaET3x4YVj5HMJmOIEqx4SgIxDgwrdNA";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG9e0tsti2INZDDcM-HPMO29nojxFxebmRUDz_rR_ZilbNBggWoDTKyc5yxJwMnPtV/exec";
        const LIMIT = 1500;

        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        // SISTEM MONITORING GSHEET
        window.addRecord = async function() {
            const amountInput = document.getElementById('fluid-amount');
            const amount = parseInt(amountInput.value);
            const type = document.getElementById('fluid-type').value;
            const btn = document.getElementById('btn-simpan');

            if(!amount || amount <= 0) return alert("Masukkan angka!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Sinkronisasi GDrive...`;

            try {
                const payload = { 
                    nama: localStorage.getItem('pasien_nama') || "Humaira", 
                    kamar: localStorage.getItem('pasien_kamar') || "001", 
                    jk: localStorage.getItem('pasien_jk') || "Laki-laki", 
                    amount, type 
                };

                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });

                if(type === 'IN') {
                    let cur = parseInt(localStorage.getItem('totalIn') || 0);
                    localStorage.setItem('totalIn', cur + amount);
                }
                
                alert("Berhasil dicatat di Google Sheets!");
                updateUI();
                amountInput.value = '';
            } catch (e) { alert("Gagal Kirim Data."); }
            finally { btn.disabled = false; btn.innerHTML = `<i class="fas fa-cloud-upload-alt mr-2"></i> SIMPAN KE GSHEET`; }
        }

        // SISTEM MIRA.AI AGENT
        window.askMira = async function() {
            const input = document.getElementById('mira-input');
            const msgBox = document.getElementById('mira-messages');
            if(!input.value) return;

            const userMsg = input.value;
            // Tampilan Chat User
            msgBox.innerHTML += `<div class="flex justify-end"><div class="bg-slate-900 text-white p-4 rounded-2xl rounded-tr-none shadow-md text-xs font-bold">${userMsg}</div></div>`;
            input.value = "";
            msgBox.scrollTop = msgBox.scrollHeight;

            const totalIn = localStorage.getItem('totalIn') || 0;
            const prompt = `Identitas Anda adalah "Mira.AI", asisten kesehatan virtual masa depan yang sangat cerdas, empati, dan ramah. 
            Tugas Anda membantu pasien gagal ginjal/jantung bernama Humaira. 
            Data saat ini: Asupan Humaira ${totalIn}ml dari batas ${LIMIT}ml. 
            Pertanyaan Pasien: "${userMsg}". 
            Berikan jawaban yang akurat secara medis, singgung data asupan hari ini jika relevan, dan gunakan gaya bahasa profesional namun hangat. Bahasa Indonesia yang baik.`;

            try {
                const result = await model.generateContent(prompt);
                const reply = result.response.text();
                
                msgBox.innerHTML += `<div class="flex gap-3"><div class="w-8 h-8 rounded-xl mira-gradient flex items-center justify-center text-white text-[10px] flex-shrink-0 mt-1"><i class="fas fa-robot"></i></div><div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-xs font-semibold text-indigo-700 leading-relaxed italic italic"><b>Mira.AI:</b> ${reply}</div></div>`;
                msgBox.scrollTop = msgBox.scrollHeight;
            } catch (e) { 
                msgBox.innerHTML += `<div class="p-3 bg-red-50 text-red-600 rounded-xl text-[10px]">Error: Koneksi Mira.AI terputus. Pastikan API Key valid.</div>`;
            }
        }

        window.toggleMira = () => document.getElementById('mira-panel').classList.toggle('hidden');

        function updateUI() {
            const totalIn = parseInt(localStorage.getItem('totalIn') || 0);
            const percent = Math.min((totalIn / LIMIT) * 100, 100);
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";

            // Update identitas
            document.getElementById('display-nama').innerText = localStorage.getItem('pasien_nama') || "HUMAIRA";
            document.getElementById('display-info').innerText = `KAMAR ${localStorage.getItem('pasien_kamar') || "001"} | ${localStorage.getItem('pasien_jk') || "LAKI-LAKI"}`;
            document.getElementById('display-jk-tag').innerText = localStorage.getItem('pasien_jk') || "LAKI-LAKI";
        }

        updateUI();
    </script>
</body>
</html>
