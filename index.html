<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health Pro - AI Integrated</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; transition: all 0.5s ease; }
        .clinical-card { background: #ffffff; border-radius: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
        .mira-accent { background: #4f46e5; }
        .status-pill { padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-normal { background: #f0fdf4; color: #166534; }
        .status-warning { background: #fffbeb; color: #92400e; }
        .status-critical { background: #fef2f2; color: #991b1b; animation: pulseRed 1.5s infinite; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
        }

        /* AI Bubble Style */
        .ai-bubble {
            position: relative;
            background: #eef2ff;
            border-radius: 20px;
            border-bottom-left-radius: 2px;
            padding: 15px;
            border: 1px solid #e0e7ff;
        }
        .ai-bubble::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 0;
            height: 0;
            border-right: 15px solid #eef2ff;
            border-top: 15px solid transparent;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <div id="setup-form" class="hidden clinical-card p-10 space-y-8 text-center animate-fade">
            <div class="space-y-6">
                <div class="relative inline-block">
                    <div class="w-20 h-20 mira-accent rounded-[2rem] flex items-center justify-center mx-auto text-white shadow-2xl relative z-10 animate-bounce">
                        <i class="fas fa-robot text-3xl"></i>
                    </div>
                    <div class="absolute inset-0 bg-indigo-400 blur-3xl opacity-20 rounded-full"></div>
                </div>

                <div class="ai-bubble text-left">
                    <p id="ai-welcome-msg" class="text-xs font-bold text-indigo-700 leading-relaxed italic">
                        "Sedang memuat salam hangat untuk Anda..."
                    </p>
                </div>

                <div class="space-y-1">
                    <h2 class="text-2xl font-black text-slate-900 tracking-tight uppercase italic">Mira Health</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Sistem Pemulihan Cerdas</p>
                </div>
            </div>

            <div class="space-y-3">
                <div class="text-left">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 mb-1 block">Identitas Pasien</label>
                    <input id="input-name" type="text" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-semibold outline-none focus:ring-4 focus:ring-indigo-50 focus:border-indigo-400 transition-all">
                </div>
                <input id="input-room" type="text" placeholder="Nomor Kamar (Contoh: 301A)" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-semibold outline-none focus:ring-4 focus:ring-indigo-50 focus:border-indigo-400 transition-all">
            </div>
            
            <button onclick="saveIdentity()" class="w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-xl shadow-indigo-100 uppercase text-xs tracking-widest hover:scale-[1.02] active:scale-95 transition-all">
                Mulai Monitoring <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>

        <div id="display-profile" class="hidden clinical-card p-5 flex justify-between items-center sticky top-4 z-50 bg-white/90 backdrop-blur-lg animate-fade">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 mira-accent rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fas fa-robot text-sm"></i>
                </div>
                <div>
                    <h2 id="patient-name" class="font-extrabold text-sm leading-none text-slate-900 uppercase"></h2>
                    <p id="patient-room" class="text-[9px] text-indigo-600 mt-1 font-bold tracking-widest uppercase"></p>
                </div>
            </div>
            <button onclick="resetApp()" class="w-10 h-10 rounded-full bg-slate-50 text-slate-300 hover:text-red-500 flex items-center justify-center transition-all">
                <i class="fas fa-power-off"></i>
            </button>
        </div>

        <div id="main-dashboard" class="hidden space-y-5 animate-fade">
            
            <div class="clinical-card p-8 text-center space-y-6">
                <div class="flex justify-between items-center">
                    <span id="hydration-alert" class="text-[9px] font-black text-slate-400 uppercase tracking-widest italic">Sinkronisasi Cloud...</span>
                    <span id="status-tag" class="status-pill status-normal">Aktif</span>
                </div>
                
                <div class="py-2">
                    <span id="percent-display" class="text-7xl font-black tracking-tighter text-slate-900">0<small class="text-2xl text-slate-300">%</small></span>
                </div>
                
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden shadow-inner">
                    <div id="progress-bar" class="mira-accent h-full w-0 transition-all duration-1000 ease-out shadow-lg shadow-indigo-200"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-50">
                    <div class="bg-indigo-50/50 p-2 rounded-xl">
                        <p class="text-[8px] font-bold text-slate-400 uppercase mb-1">Masuk</p>
                        <p class="text-sm font-black text-indigo-700" id="intake-display">0 ml</p>
                    </div>
                    <div class="bg-slate-50 p-2 rounded-xl">
                        <p class="text-[8px] font-bold text-slate-400 uppercase mb-1">Keluar</p>
                        <p class="text-sm font-black text-slate-800" id="output-display">0 ml</p>
                    </div>
                    <div class="bg-emerald-50/50 p-2 rounded-xl">
                        <p class="text-[8px] font-bold text-slate-400 uppercase mb-1">Balance</p>
                        <p class="text-sm font-black text-emerald-700" id="balance-display">0 ml</p>
                    </div>
                </div>
            </div>

            <div class="clinical-card p-6 space-y-4">
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Volume (ml)</label>
                        <input id="fluid-amount" type="number" inputmode="numeric" placeholder="Contoh: 250" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl font-black text-2xl outline-none focus:ring-4 focus:ring-indigo-50 transition-all">
                    </div>
                    <div class="w-1/3">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Aktivitas</label>
                        <select id="fluid-type" class="w-full h-[66px] bg-slate-50 border border-slate-200 px-3 rounded-2xl font-bold text-xs outline-none">
                            <option value="IN">💧 Masuk</option>
                            <option value="OUT">🚽 Keluar</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1.5 block">Catatan Klinis (Opsional)</label>
                    <input id="fluid-note" type="text" placeholder="Misal: Minum obat, urin pekat..." class="w-full bg-slate-50 border border-slate-100 p-3 rounded-xl text-xs font-semibold outline-none focus:border-indigo-400 transition-all">
                </div>

                <button id="submit-btn" onclick="addRecord()" class="w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-xl shadow-indigo-100 active:scale-95 transition-all flex items-center justify-center gap-3 uppercase text-xs tracking-widest">
                    Simpan ke Rekam Medis
                </button>
            </div>

            <div class="clinical-card p-6 space-y-4">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 flex items-center gap-2">
                    <i class="fas fa-chart-line text-indigo-500"></i> Tren Pemulihan 7 Hari
                </h3>
                <div class="h-48 w-full">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyilbUEyIqqcu-3q8uMZhD7wC7-1hIQf-355TBXC1HHO4FihCeBlgVE9m70hrQqK_lA/exec";
        const DAILY_LIMIT = 1500;
        let myChart = null;

        // 1. AI GREETING LOGIC (SAAT START)
        function setAiGreeting() {
            const msgEl = document.getElementById('ai-welcome-msg');
            const hrs = new Date().getHours();
            let greet = (hrs < 11) ? "Selamat Pagi" : (hrs < 15) ? "Selamat Siang" : (hrs < 19) ? "Selamat Sore" : "Selamat Malam";
            
            const msgs = [
                `${greet}! Saya Mira AI. Mari jaga hidrasi Anda hari ini. Salam Sehat!`,
                `${greet}! Senang melihat Anda. Mari catat perkembangan cairan Anda. Salam Sehat!`,
                `${greet}! Saya siap membantu memantau pemulihan Anda. Salam Sehat!`
            ];
            msgEl.innerText = `"${msgs[Math.floor(Math.random() * msgs.length)]}"`;
        }

        // 2. CLOUD SYNC & DATA FETCH
        async function syncWithCloud() {
            const name = localStorage.getItem('mira_name');
            const room = localStorage.getItem('mira_room');
            
            if(!name || !room) {
                document.getElementById('setup-form').classList.remove('hidden');
                setAiGreeting();
                return;
            }

            document.getElementById('display-profile').classList.remove('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('patient-name').innerText = name;
            document.getElementById('patient-room').innerText = `KAMAR ${room}`;

            try {
                const response = await fetch(`${GAS_URL}?name=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}`);
                const data = await response.json();
                
                updateDisplay(data.totalIn || 0, data.totalOut || 0, data.lastUpdate);
                if(data.weekly) renderChart(data.weekly);
                
            } catch (e) {
                console.error("Sync Error:", e);
                document.getElementById('status-tag').innerText = "OFFLINE";
            }
        }

        // 3. SAVE DATA
        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const noteInput = document.getElementById('fluid-note');
            const btn = document.getElementById('submit-btn');
            const val = parseInt(amountInput.value);

            if(!val || val <= 0) return amountInput.classList.add('border-red-400');
            amountInput.classList.remove('border-red-400');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Menghubungkan Cloud...`;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        type: "SAVE_RECORD",
                        name: localStorage.getItem('mira_name'),
                        room: localStorage.getItem('mira_room'),
                        fluidType: document.getElementById('fluid-type').value === 'IN' ? 'Minum/Infus' : 'Urin',
                        amount: val,
                        note: noteInput.value || ""
                    })
                });
                
                const result = await response.json();
                updateDisplay(result.totalIn, result.totalOut, new Date().toISOString());
                if(result.weekly) renderChart(result.weekly);
                
                amountInput.value = '';
                noteInput.value = '';
                btn.innerHTML = `<i class="fas fa-check-circle"></i> Berhasil Disimpan`;
                btn.classList.replace('mira-accent', 'bg-emerald-600');
            } catch (e) {
                btn.innerHTML = `<i class="fas fa-times-circle"></i> Gagal Cloud`;
                btn.classList.replace('mira-accent', 'bg-rose-500');
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = `Simpan ke Rekam Medis`;
                    btn.className = "w-full mira-accent text-white font-bold py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3 uppercase text-xs tracking-widest transition-all";
                }, 2500);
            }
        }

        // 4. UI RENDER & SMART REMINDER
        function updateDisplay(tin, tout, lastUpdate) {
            const balance = tin - tout;
            const percent = Math.min((tin / DAILY_LIMIT) * 100, 100);

            document.getElementById('intake-display').innerText = tin + " ml";
            document.getElementById('output-display').innerText = tout + " ml";
            document.getElementById('balance-display').innerText = balance + " ml";
            document.getElementById('percent-display').innerHTML = `${Math.round(percent)}<small class="text-2xl text-slate-300">%</small>`;
            
            const pb = document.getElementById('progress-bar');
            pb.style.width = percent + '%';
            
            // Smart Reminder Logic
            const alertTag = document.getElementById('hydration-alert');
            if(lastUpdate) {
                const diff = (new Date() - new Date(lastUpdate)) / (1000 * 60 * 60);
                if(diff > 2) {
                    alertTag.innerText = "⚠️ Belum minum > 2 jam";
                    alertTag.className = "text-[9px] font-black text-rose-500 uppercase tracking-widest italic";
                } else {
                    alertTag.innerText = "💧 Hidrasi Optimal";
                    alertTag.className = "text-[9px] font-bold text-emerald-500 uppercase tracking-widest italic";
                }
            }

            const tag = document.getElementById('status-tag');
            if(percent >= 100) {
                tag.innerText = "KRITIS"; tag.className = "status-pill status-critical";
                pb.className = "bg-rose-600 h-full transition-all duration-1000";
            } else {
                tag.innerText = "SINKRON"; tag.className = "status-pill status-normal";
                pb.className = "mira-accent h-full transition-all duration-1000";
            }
        }

        // 5. CHART RENDER
        function renderChart(history) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.labels,
                    datasets: [{
                        data: history.values,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.05)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 2,
                        pointBackgroundColor: '#4f46e5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, display: false },
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' }, color: '#94a3b8' } }
                    }
                }
            });
        }

        function saveIdentity() {
            const n = document.getElementById('input-name').value.trim();
            const r = document.getElementById('input-room').value.trim();
            if(n && r) {
                localStorage.setItem('mira_name', n.toUpperCase());
                localStorage.setItem('mira_room', r.toUpperCase());
                location.reload();
            } else {
                alert("Mohon lengkapi Nama dan Kamar.");
            }
        }

        function resetApp() { if(confirm("Keluar dan hapus sesi pasien?")) { localStorage.clear(); location.reload(); } }

        // Start App
        document.addEventListener('DOMContentLoaded', syncWithCloud);
    </script>
</body>
</html>
