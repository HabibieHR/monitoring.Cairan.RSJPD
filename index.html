<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health - Sistem Monitoring Klinis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        
        .clinical-card { 
            background: #ffffff; 
            border-radius: 24px; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.03); 
            border: 1px solid #f1f5f9; 
        }
        
        .mira-accent { background: #334155; }
        .mira-success { background: #10b981 !important; }
        .mira-error { background: #ef4444 !important; }

        .status-pill { padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-normal { background: #f0f9ff; color: #0369a1; border: 1px solid #e0f2fe; }
        .status-critical { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; animation: pulseRed 1.5s infinite; }
        
        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        .animate-fade { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Med-Tech Aura */
        .med-tech-aura {
            position: relative; width: 85px; height: 85px; margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
        }
        .med-tech-aura::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            border: 2px solid #334155; opacity: 0.1;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: rotateAura 10s linear infinite;
        }
        @keyframes rotateAura { to { transform: rotate(360deg); } }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <div id="setup-form" class="hidden clinical-card p-10 space-y-8 text-center animate-fade">
            <div class="space-y-6">
                <div class="med-tech-aura">
                    <i class="fas fa-shield-virus text-4xl text-slate-700 relative z-10"></i>
                </div>
                <div class="space-y-2">
                    <h2 class="text-xl font-extrabold text-slate-900 tracking-tight uppercase">Mira Health</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em]">Clinical OS v2.0</p>
                </div>
                <div class="bg-slate-50 border-l-4 border-slate-800 p-4 text-left rounded-r-xl">
                    <p id="ai-welcome-msg" class="text-[11px] font-semibold text-slate-600 leading-relaxed italic"></p>
                </div>
            </div>

            <div class="space-y-4 pt-4">
                <div class="text-left">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-2 block tracking-widest">Identitas Pasien</label>
                    <input id="input-name" type="text" placeholder="Nama Sesuai Gelang" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none focus:border-slate-400 transition-all text-sm uppercase">
                </div>
                <input id="input-room" type="text" placeholder="Nomor Kamar & Bed" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none focus:border-slate-400 transition-all text-sm uppercase">
            </div>
            
            <button onclick="saveIdentity()" class="w-full mira-accent text-white font-black py-5 rounded-2xl uppercase text-[11px] tracking-[0.2em] shadow-lg shadow-slate-200 active:scale-95 transition-all">
                Aktifkan Sesi Monitoring
            </button>
        </div>

        <div id="display-profile" class="hidden flex justify-between items-center animate-fade bg-white/80 backdrop-blur-md p-4 rounded-3xl sticky top-4 z-50 border border-white shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 mira-accent rounded-xl flex items-center justify-center text-white shadow-inner">
                    <i class="fas fa-user-md text-sm"></i>
                </div>
                <div>
                    <h2 id="patient-name" class="font-black text-xs text-slate-900 leading-none"></h2>
                    <p id="patient-room" class="text-[9px] text-slate-500 mt-1 font-bold tracking-widest"></p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right mr-2">
                    <div class="flex items-center gap-1.5 justify-end">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <span class="text-[8px] font-black text-slate-400 uppercase">Live</span>
                    </div>
                </div>
                <button onclick="resetApp()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-power-off text-xs"></i>
                </button>
            </div>
        </div>

        <div id="main-dashboard" class="hidden space-y-5 animate-fade">
            <div class="clinical-card p-8 space-y-8">
                <div class="flex justify-between items-center">
                    <span id="hydration-alert" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Menganalisis...</span>
                    <span id="status-tag" class="status-pill status-normal">Stabil</span>
                </div>
                
                <div class="py-4 text-center">
                    <span id="percent-display" class="text-8xl font-black tracking-tighter text-slate-900">0<small class="text-2xl text-slate-300 ml-1">%</small></span>
                    <p class="text-[10px] text-slate-400 mt-4 font-bold uppercase tracking-[0.2em]">Daily Goal: 1.500 ml</p>
                </div>
                
                <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden p-1 border border-slate-50 shadow-inner">
                    <div id="progress-bar" class="mira-accent h-full rounded-full w-0 transition-all duration-1000 ease-out shadow-lg shadow-slate-200"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-4 pt-2">
                    <div class="text-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <p class="text-[8px] font-black text-slate-400 uppercase mb-2 tracking-widest">Intake</p>
                        <p class="text-lg font-black text-slate-900" id="intake-display">0</p>
                    </div>
                    <div class="text-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <p class="text-[8px] font-black text-slate-400 uppercase mb-2 tracking-widest">Output</p>
                        <p class="text-lg font-black text-slate-900" id="output-display">0</p>
                    </div>
                    <div id="balance-panel" class="text-center p-4 bg-sky-50 rounded-2xl border border-sky-100 transition-colors">
                        <p class="text-[8px] font-black text-sky-600 uppercase mb-2 tracking-widest">Balance</p>
                        <p class="text-lg font-black text-sky-900" id="balance-display">0</p>
                    </div>
                </div>
            </div>

            <div class="clinical-card p-6 space-y-5">
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-3 block tracking-widest">Volume (ML)</label>
                        <input id="fluid-amount" type="number" inputmode="numeric" pattern="\d*" min="1" placeholder="0" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl font-black text-3xl outline-none focus:ring-4 focus:ring-slate-50 transition-all">
                    </div>
                    <div class="w-[40%]">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-3 block tracking-widest">Aktivitas</label>
                        <select id="fluid-type" class="w-full h-[76px] bg-slate-50 border border-slate-100 px-4 rounded-2xl font-bold text-xs outline-none appearance-none">
                            <option value="IN">💧 ASUPAN</option>
                            <option value="OUT">🚽 KELUAR</option>
                        </select>
                    </div>
                </div>

                <button id="submit-btn" onclick="addRecord()" class="w-full mira-accent text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3 uppercase text-[11px] tracking-[0.2em]">
                    Catat ke Cloud Medis
                </button>
            </div>

            <div class="clinical-card p-7">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <i class="fas fa-chart-line text-slate-300"></i> Tren Pemulihan 7 Hari
                </h3>
                <div class="h-44 w-full">
                    <canvas id="weeklyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GANTI URL INI DENGAN URL GOOGLE APPS SCRIPT ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyilbUEyIqqcu-3q8uMZhD7wC7-1hIQf-355TBXC1HHO4FihCeBlgVE9m70hrQqK_lA/exec";
        const DAILY_LIMIT = 1500;
        let myChart = null;

        function setAiGreeting() {
            const msgEl = document.getElementById('ai-welcome-msg');
            const hrs = new Date().getHours();
            let greet = (hrs < 11) ? "Selamat Pagi" : (hrs < 15) ? "Selamat Siang" : (hrs < 19) ? "Selamat Sore" : "Selamat Malam";
            msgEl.innerText = `"${greet}. Sistem AI Mira siap memantau parameter hidrasi Anda secara real-time. Mohon lengkapi data administratif."`;
        }

        async function syncWithCloud() {
            const name = localStorage.getItem('mira_name');
            const room = localStorage.getItem('mira_room');
            if(!name || !room) {
                document.getElementById('setup-form').classList.remove('hidden');
                setAiGreeting();
                return;
            }
            document.getElementById('display-profile').classList.remove('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('patient-name').innerText = name;
            document.getElementById('patient-room').innerText = `ROOM ${room}`;
            
            try {
                const response = await fetch(`${GAS_URL}?name=${encodeURIComponent(name)}&room=${encodeURIComponent(room)}`);
                const data = await response.json();
                updateDisplay(data.totalIn || 0, data.totalOut || 0, data.lastUpdate);
                if(data.weekly) renderChart(data.weekly);
            } catch (e) { 
                console.log("Offline mode atau GAS belum terpasang.");
            }
        }

        async function addRecord() {
            const amountInput = document.getElementById('fluid-amount');
            const type = document.getElementById('fluid-type').value;
            const btn = document.getElementById('submit-btn');
            const val = parseInt(amountInput.value);

            if(!val || val <= 0) {
                amountInput.classList.add('border-rose-400');
                return;
            }
            amountInput.classList.remove('border-rose-400');

            // Visual State: Loading
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Sinkronisasi Cloud...`;
            btn.classList.add('opacity-80');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk GAS
                    body: JSON.stringify({
                        type: "SAVE_RECORD",
                        name: localStorage.getItem('mira_name'),
                        room: localStorage.getItem('mira_room'),
                        fluidType: type === 'IN' ? 'Minum/Infus' : 'Urin',
                        amount: val
                    })
                });

                // Visual State: Success (Saran No 2)
                btn.innerHTML = `<i class="fas fa-check-double text-lg"></i> Berhasil Disimpan`;
                btn.className = "w-full mira-success text-white font-black py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3 uppercase text-[11px] tracking-[0.2em]";
                
                amountInput.value = '';
                // Simulasi update lokal (karena no-cors tidak mengembalikan body secara langsung)
                setTimeout(() => location.reload(), 1500);

            } catch (e) { 
                btn.innerHTML = `<i class="fas fa-times"></i> Gagal Terhubung`;
                btn.className = "w-full mira-error text-white font-black py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3 uppercase text-[11px] tracking-[0.2em]";
                setTimeout(() => {
                    btn.disabled = false;
                    btn.className = "w-full mira-accent text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3 uppercase text-[11px] tracking-[0.2em]";
                    btn.innerHTML = "Catat ke Cloud Medis";
                }, 2000);
            }
        }

        function updateDisplay(tin, tout, lastUpdate) {
            const balance = tin - tout;
            const percent = Math.min((tin / DAILY_LIMIT) * 100, 100);
            
            document.getElementById('intake-display').innerText = tin + " ml";
            document.getElementById('output-display').innerText = tout + " ml";
            document.getElementById('balance-display').innerText = (balance > 0 ? "+" : "") + balance + " ml";
            document.getElementById('percent-display').innerHTML = `${Math.round(percent)}<small class="text-2xl text-slate-300 ml-1">%</small>`;
            document.getElementById('progress-bar').style.width = percent + '%';
            
            // Smart Warning Balance (Saran No 2)
            const balancePanel = document.getElementById('balance-panel');
            const balanceText = document.getElementById('balance-display');
            if (balance > 1000) {
                balancePanel.className = "text-center p-4 bg-orange-50 rounded-2xl border border-orange-100 transition-colors";
                balanceText.className = "text-lg font-black text-orange-700";
            }

            const alertTag = document.getElementById('hydration-alert');
            if(lastUpdate) {
                const diff = (new Date() - new Date(lastUpdate)) / (1000 * 60 * 60);
                if(diff > 3) {
                    alertTag.innerText = "⚠️ Belum ada aktivitas > 3 jam";
                    alertTag.className = "text-[10px] font-black text-rose-500 uppercase tracking-widest";
                } else {
                    alertTag.innerText = "💧 Hidrasi Terpantau";
                }
            }

            const tag = document.getElementById('status-tag');
            if(percent >= 100) {
                tag.innerText = "Target Tercapai";
                tag.className = "status-pill status-critical";
            }
        }

        function renderChart(history) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.labels,
                    datasets: [{
                        data: history.values,
                        borderColor: '#334155',
                        backgroundColor: 'rgba(51, 65, 85, 0.05)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#334155'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { display: false }, 
                        x: { grid: { display: false }, ticks: { font: { size: 9, weight: '700' }, color: '#94a3b8' } } 
                    }
                }
            });
        }

        function saveIdentity() {
            const n = document.getElementById('input-name').value.trim();
            const r = document.getElementById('input-room').value.trim();
            if(n && r) {
                localStorage.setItem('mira_name', n.toUpperCase());
                localStorage.setItem('mira_room', r.toUpperCase());
                location.reload();
            }
        }

        function resetApp() { if(confirm("Hapus sesi klinis pasien?")) { localStorage.clear(); location.reload(); } }
        document.addEventListener('DOMContentLoaded', syncWithCloud);
    </script>
</body>
</html>
