<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Cairan Pasien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .progress-fill { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-xl font-bold">Pemantau Cairan Harian</h1>
            <p class="text-sm opacity-80">Pasien Gagal Ginjal / Jantung</p>
        </div>

        <div class="p-6">
            <div class="flex justify-between mb-2">
                <span class="text-gray-600 font-medium">Progress Cairan Masuk</span>
                <span id="status-percent" class="font-bold text-blue-600">0%</span>
            </div>
            
            <div class="w-full bg-gray-200 rounded-full h-4 mb-4">
                <div id="progress-bar" class="progress-fill bg-green-500 h-4 rounded-full" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-blue-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 uppercase">Total Masuk</p>
                    <p id="total-in" class="text-xl font-bold text-blue-700">0 ml</p>
                </div>
                <div class="bg-orange-50 p-3 rounded-lg">
                    <p class="text-xs text-gray-500 uppercase">Total Keluar</p>
                    <p id="total-out" class="text-xl font-bold text-orange-700">0 ml</p>
                </div>
            </div>

            <div id="warning-box" class="hidden mt-4 p-3 rounded-lg text-sm font-medium text-center"></div>
        </div>

        <hr>

        <div class="p-6 space-y-4">
            <h3 class="font-semibold text-gray-700">Input Data (Tiap 4 Jam)</h3>
            
            <div class="flex gap-2">
                <input id="fluid-amount" type="number" placeholder="Jumlah (ml)" class="flex-1 border p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
                <select id="fluid-type" class="border p-2 rounded-lg bg-white">
                    <option value="IN">Masuk (Minum)</option>
                    <option value="OUT">Keluar (Urin)</option>
                </select>
            </div>
            
            <button onclick="addRecord()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                Simpan Data
            </button>
        </div>

        <div class="p-6 bg-gray-50">
            <h3 class="font-semibold text-gray-700 mb-2 text-sm italic">Catatan Hari Ini:</h3>
            <ul id="history-list" class="text-xs text-gray-600 space-y-1"></ul>
        </div>
    </div>

    <script>
        // Data Awal
        let totalIn = 0;
        let totalOut = 0;
        const limitHarian = 1500; // Contoh batas 1500ml

        function addRecord() {
            const amount = parseInt(document.getElementById('fluid-amount').value);
            const type = document.getElementById('fluid-type').value;

            if (!amount || amount <= 0) {
                alert("Masukkan jumlah ml yang valid");
                return;
            }

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            if (type === 'IN') {
                totalIn += amount;
            } else {
                totalOut += amount;
            }

            updateUI(type, amount, timeStr);
            document.getElementById('fluid-amount').value = '';
        }

        function updateUI(type, amount, time) {
            // Update Angka
            document.getElementById('total-in').innerText = totalIn + " ml";
            document.getElementById('total-out').innerText = totalOut + " ml";

            // Update Progress Bar
            const percent = Math.min((totalIn / limitHarian) * 100, 100);
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percent + "%";
            document.getElementById('status-percent').innerText = Math.round(percent) + "%";

            // Logika Warna & Peringatan
            const warningBox = document.getElementById('warning-box');
            warningBox.classList.remove('hidden');

            if (totalIn > limitHarian) {
                progressBar.className = "progress-fill bg-red-600 h-4 rounded-full";
                warningBox.className = "mt-4 p-3 rounded-lg text-sm font-medium text-center bg-red-100 text-red-700";
                warningBox.innerText = "⚠️ BAHAYA! Sudah melewati batas " + limitHarian + "ml.";
            } else if (totalIn >= limitHarian * 0.8) {
                progressBar.className = "progress-fill bg-yellow-500 h-4 rounded-full";
                warningBox.className = "mt-4 p-3 rounded-lg text-sm font-medium text-center bg-yellow-100 text-yellow-700";
                warningBox.innerText = "⚠️ WASPADA: Mendekati batas harian.";
            } else {
                progressBar.className = "progress-fill bg-green-500 h-4 rounded-full";
                warningBox.innerText = "Status: Aman";
                warningBox.className = "mt-4 p-3 rounded-lg text-sm font-medium text-center bg-green-100 text-green-700";
            }

            // Tambah ke History
            const historyList = document.getElementById('history-list');
            const item = document.createElement('li');
            item.innerText = `[${time}] ${type}: ${amount}ml`;
            historyList.prepend(item);
        }
    </script>
</body>
</html>
