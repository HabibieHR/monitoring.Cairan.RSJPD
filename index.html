<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mira Health - Clinical AI Agent v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .clinical-card { background: #ffffff; border-radius: 24px; box-shadow: 0 4px 30px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
        .mira-accent { background: #334155; }
        .mira-success { background: #10b981 !important; }
        .mira-error { background: #ef4444 !important; }
        
        /* AI Agent Glow Effect */
        .ai-pulse { position: relative; }
        .ai-pulse::after {
            content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: rgba(99, 102, 241, 0.2); border-radius: inherit;
            animation: ai-glow 2s infinite;
        }
        @keyframes ai-glow { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        .status-pill { padding: 5px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-normal { background: #f0f9ff; color: #0369a1; border: 1px solid #e0f2fe; }
        .animate-fade { animation: fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Med-Tech Aura */
        .med-tech-aura { position: relative; width: 85px; height: 85px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
        .med-tech-aura::before {
            content: ''; position: absolute; width: 100%; height: 100%; border: 2px solid #334155; opacity: 0.1;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: rotateAura 10s linear infinite;
        }
        @keyframes rotateAura { to { transform: rotate(360deg); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <div id="setup-form" class="hidden clinical-card p-10 space-y-8 text-center animate-fade">
            <div class="space-y-6">
                <div class="med-tech-aura">
                    <i class="fas fa-microchip text-4xl text-slate-700 relative z-10"></i>
                </div>
                <h2 class="text-xl font-extrabold text-slate-900 uppercase">Mira Health</h2>
                <div class="bg-slate-50 border-l-4 border-slate-800 p-4 text-left rounded-r-xl">
                    <p id="ai-welcome-msg" class="text-[11px] font-semibold text-slate-600 italic"></p>
                </div>
            </div>
            <div class="space-y-4">
                <input id="input-name" type="text" placeholder="NAMA PASIEN" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm uppercase">
                <input id="input-room" type="text" placeholder="NOMOR KAMAR" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm uppercase">
            </div>
            <button onclick="saveIdentity()" class="w-full mira-accent text-white font-black py-5 rounded-2xl uppercase text-[11px] tracking-[0.2em] shadow-lg active:scale-95 transition-all">Aktifkan Sesi Monitoring</button>
        </div>

        <div id="display-profile" class="hidden flex justify-between items-center animate-fade bg-white/80 backdrop-blur-md p-4 rounded-3xl sticky top-4 z-50 border border-white shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-inner">
                    <i class="fas fa-brain text-sm"></i>
                </div>
                <div>
                    <h2 id="patient-name" class="font-black text-xs text-slate-900 leading-none"></h2>
                    <p id="patient-room" class="text-[9px] text-slate-500 mt-1 font-bold tracking-widest"></p>
                </div>
            </div>
            <button onclick="resetApp()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-power-off text-xs"></i></button>
        </div>

        <div id="main-dashboard" class="hidden space-y-5 animate-fade">
            
            <div class="clinical-card p-6 bg-gradient-to-br from-slate-900 to-indigo-950 text-white overflow-hidden relative">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-indigo-500/10 rounded-full blur-3xl"></div>
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-indigo-400 rounded-full ai-pulse mr-1"></div>
                        <span class="text-[10px] font-black tracking-[0.2em] text-indigo-200 uppercase">AI Agent Analysis</span>
                    </div>
                    <span class="text-[9px] font-bold px-2 py-1 bg-white/10 rounded-md border border-white/10 uppercase">v2.5 Engine</span>
                </div>
                
                <div id="ai-agent-screen" class="space-y-3">
                    <div class="flex gap-3">
                        <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center border border-indigo-500/30">
                            <i class="fas fa-robot text-indigo-300 text-xs"></i>
                        </div>
                        <div class="space-y-1">
                            <p id="ai-status-text" class="text-[11px] font-medium text-indigo-50 leading-relaxed">
                                Memindai parameter klinis pasien...
                            </p>
                            <div id="ai-thinking-bar" class="w-24 h-1 bg-indigo-500/20 rounded-full overflow-hidden">
                                <div class="h-full bg-indigo-400 animate-[loading_2s_infinite]"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-white/10 flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <span class="text-[8px] flex-shrink-0 px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/20 font-bold uppercase">Fluid Balance OK</span>
                    <span id="tag-hydration" class="text-[8px] flex-shrink-0 px-2 py-1 rounded bg-indigo-500/20 text-indigo-200 border border-indigo-500/20 font-bold uppercase">Analyzing Hydration</span>
                </div>
            </div>

            <div class="clinical-card p-8 space-y-8">
                <div class="flex justify-between items-center">
                    <span id="hydration-alert" class="text-[10px] font-black text-slate-400 uppercase tracking-widest uppercase">Sinkronisasi Cloud</span>
                    <span id="status-tag" class="status-pill status-normal">Stabil</span>
                </div>
                <div class="py-4 text-center">
                    <span id="percent-display" class="text-8xl font-black tracking-tighter text-slate-900">0<small class="text-2xl text-slate-300 ml-1">%</small></span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-4 p-1 border border-slate-50 shadow-inner">
                    <div id="progress-bar" class="mira-accent h-full rounded-full w-0 transition-all duration-1000 ease-out shadow-lg"></div>
                </div>
                <div class="grid grid-cols-3 gap-4 pt-2">
                    <div class="text-center p-4 bg-slate-50 rounded-2xl"><p class="text-[8px] font-black text-slate-400 uppercase mb-2">Intake</p><p class="text-lg font-black text-slate-900" id="intake-display">0</p></div>
                    <div class="text-center p-4 bg-slate-50 rounded-2xl"><p class="text-[8px] font-black text-slate-400 uppercase mb-2">Output</p><p class="text-lg font-black text-slate-900" id="output-display">0</p></div>
                    <div id="balance-panel" class="text-center p-4 bg-sky-50 rounded-2xl"><p class="text-[8px] font-black text-sky-600 uppercase mb-2">Balance</p><p class="text-lg font-black text-sky-900" id="balance-display">0</p></div>
                </div>
            </div>

            <div class="clinical-card p-6 space-y-5">
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-3 block">Volume (ML)</label>
                        <input id="fluid-amount" type="number" inputmode="numeric" placeholder="0" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-2xl font-black text-3xl outline-none">
                    </div>
                    <div class="w-[40%]">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-3 block">Aktivitas</label>
                        <select id="fluid-type" class="w-full h-[76px] bg-slate-50 border border-slate-100 px-4 rounded-2xl font-bold text-xs outline-none">
                            <option value="IN">💧 ASUPAN</option>
                            <option value="OUT">🚽 KELUAR</option>
                        </select>
                    </div>
                </div>
                <button id="submit-btn" onclick="addRecord()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-100 active:scale-95 transition-all uppercase text-[11px] tracking-[0.2em]">Catat ke Cloud Medis</button>
            </div>

            <div class="clinical-card p-7">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6 flex items-center gap-2"><i class="fas fa-chart-line"></i> Tren Pemulihan 7 Hari</h3>
                <div class="h-44 w-full"><canvas id="weeklyChart"></canvas></div>
            </div>
        </div>
    </div>

    <style>
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>

    <script>
        const GAS_URL = "YOUR_GAS_URL_HERE"; 
        const DAILY_LIMIT = 1500;
        let myChart = null;

        // AI AGENT LOGIC (Saran No 2 + AI Agent)
        function runAiAnalysis(tin, tout, balance) {
            const screen = document.getElementById('ai-status-text');
            const bar = document.getElementById('ai-thinking-bar');
            const tagHydration = document.getElementById('tag-hydration');
            
            setTimeout(() => {
                bar.classList.add('hidden');
                let message = "";
                let colorTag = "text-indigo-200";

                if (tin === 0) {
                    message = "Agent: Belum ada data asupan hari ini. Mohon instruksikan pasien untuk mulai hidrasi.";
                } else if (tin < 500) {
                    message = "Agent: Asupan cairan rendah. Risiko dehidrasi ringan terdeteksi.";
                } else if (balance > 800) {
                    message = "Agent: Peringatan retensi cairan. Volume masuk jauh melebihi keluaran. Pantau tanda edema.";
                    tagHydration.innerText = "Fluid Alert";
                    tagHydration.classList.replace('bg-indigo-500/20', 'bg-rose-500/30');
                } else {
                    message = "Agent: Parameter hidrasi optimal. Melanjutkan pemantauan latar belakang.";
                    tagHydration.innerText = "Optimal Status";
                    tagHydration.classList.replace('bg-indigo-500/20', 'bg-emerald-500/30');
                }
                screen.innerText = message;
            }, 1500);
        }

        async function syncWithCloud() {
            const name = localStorage.getItem('mira_name');
            const room = localStorage.getItem('mira_room');
            if(!name || !room) {
                document.getElementById('setup-form').classList.remove('hidden');
                document.getElementById('ai-welcome-msg').innerText = "Selamat Datang. Saya adalah AI Agent Mira. Mohon input identitas pasien untuk memulai kalkulasi data klinis.";
                return;
            }
            document.getElementById('display-profile').classList.remove('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('patient-name').innerText = name;
            document.getElementById('patient-room').innerText = `ROOM ${room}`;
            
            // Dummy Data for Preview / Fetch Logic
            const tin = 750; const tout = 300; const bal = 450;
            updateDisplay(tin, tout, new Date().toISOString());
            runAiAnalysis(tin, tout, bal);
        }

        // Logic Standar (saveIdentity, resetApp, updateDisplay, renderChart, addRecord tetap sama seperti sebelumnya)
        function updateDisplay(tin, tout, lastUpdate) {
            const balance = tin - tout;
            const percent = Math.min((tin / DAILY_LIMIT) * 100, 100);
            document.getElementById('intake-display').innerText = tin + " ml";
            document.getElementById('output-display').innerText = tout + " ml";
            document.getElementById('balance-display').innerText = (balance > 0 ? "+" : "") + balance + " ml";
            document.getElementById('percent-display').innerHTML = `${Math.round(percent)}<small class="text-2xl text-slate-300 ml-1">%</small>`;
            document.getElementById('progress-bar').style.width = percent + '%';
            
            if(lastUpdate) {
                document.getElementById('hydration-alert').innerText = "Update Terakhir: " + new Date(lastUpdate).toLocaleTimeString();
            }
        }

        function saveIdentity() {
            const n = document.getElementById('input-name').value;
            const r = document.getElementById('input-room').value;
            if(n && r) { localStorage.setItem('mira_name', n.toUpperCase()); localStorage.setItem('mira_room', r.toUpperCase()); location.reload(); }
        }

        function resetApp() { if(confirm("Hapus sesi klinis?")) { localStorage.clear(); location.reload(); } }
        document.addEventListener('DOMContentLoaded', syncWithCloud);
    </script>
</body>
</html>
